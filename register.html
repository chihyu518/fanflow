<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FanFlow 加入</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #f5f6fb;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      color: #333;

    }


    .login-card {

      width: 100%;

      max-width: 420px;

      margin: 20px;

      padding: 36px 30px;

      background: white;

      border-radius: 22px;

      box-shadow:
        0 8px 30px rgba(0,0,0,0.08);

    }


    .logo {

      text-align: center;

      font-size: 30px;

      font-weight: 800;

      color: #5865f2;

      margin-bottom: 10px;

    }


    .subtitle {

      text-align: center;

      color: #888;

      font-size: 15px;

      margin-bottom: 30px;

    }


    .form-group {

      margin-bottom: 18px;

    }


    label {

      display: block;

      margin-bottom: 8px;

      font-weight: 600;

      font-size: 14px;

    }


    input {

      width: 100%;

      padding: 13px 14px;

      border: 1px solid #ddd;

      border-radius: 10px;

      font-size: 15px;

      outline: none;

    }


    input:focus {

      border-color: #5865f2;

      box-shadow:
        0 0 0 3px rgba(88,101,242,0.1);

    }


    .register-button {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 11px;

      background: #5865f2;

      color: white;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      margin-top: 8px;

    }


    .register-button:hover {

      opacity: 0.92;

    }


    .message {

      min-height: 24px;

      margin-top: 15px;

      text-align: center;

      font-size: 14px;

    }


    .back-login {

      margin-top: 20px;

      text-align: center;

      font-size: 14px;

    }


    .back-login a {

      color: #5865f2;

      font-weight: 600;

      text-decoration: none;

    }


    .footer {

      margin-top: 25px;

      text-align: center;

      color: #aaa;

      font-size: 12px;

    }

  </style>

</head>


<body>


  <div class="login-card">


    <div class="logo">
      FanFlow 💜
    </div>


    <div class="subtitle">
      建立你的 FanFlow 帳號
    </div>


    <form id="registerForm">


      <div class="form-group">

        <label for="registerName">
          顯示名稱
        </label>

        <input
          id="registerName"
          type="text"
          placeholder="例如：小明"
          required
        >

      </div>


      <div class="form-group">

        <label for="registerAccount">
          登入帳號
        </label>

        <input
          id="registerAccount"
          type="text"
          autocomplete="username"
          placeholder="請輸入登入帳號"
          required
        >

      </div>


      <div class="form-group">

        <label for="registerPassword">
          密碼
        </label>

        <input
          id="registerPassword"
          type="password"
          autocomplete="new-password"
          placeholder="請輸入密碼"
          required
        >

      </div>


      <div class="form-group">

        <label for="registerPasswordConfirm">
          確認密碼
        </label>

        <input
          id="registerPasswordConfirm"
          type="password"
          autocomplete="new-password"
          placeholder="再次輸入密碼"
          required
        >

      </div>


      <button
        class="register-button"
        id="registerButton"
        type="submit"
      >
        加入 FanFlow
      </button>


      <div
        class="message"
        id="registerMessage"
      ></div>


    </form>


    <div class="back-login">

      已經有 FanFlow 帳號？

      <a href="login.html">
        返回登入
      </a>

    </div>


    <div class="footer">
      FanFlow
    </div>


  </div>


<script>

  // =========================
  // FanFlow API
  // =========================

  const API_URL =
  'https://script.google.com/macros/s/AKfycbz7CVrbddXxIvd86Z3PeMyM9MT6q7QBe7EJ5n1uQU7pTkwCYgc-4gjcg7EmRmz5itDSJQ/exec';
  
  // =========================
  // 註冊表單
  // =========================

  document
    .getElementById('registerForm')
    .addEventListener(
      'submit',
      async function(event) {

        event.preventDefault();


        const name =
          document
            .getElementById(
              'registerName'
            )
            .value
            .trim();


        const account =
          document
            .getElementById(
              'registerAccount'
            )
            .value
            .trim();


        const password =
          document
            .getElementById(
              'registerPassword'
            )
            .value;


        const passwordConfirm =
          document
            .getElementById(
              'registerPasswordConfirm'
            )
            .value;


        const message =
          document.getElementById(
            'registerMessage'
          );


        // =========================
        // 基本檢查
        // =========================

        if (
          !name ||
          !account ||
          !password
        ) {

          message.textContent =
            '請完整填寫資料';

          return;

        }


        if (
          password !==
          passwordConfirm
        ) {

          message.textContent =
            '兩次輸入的密碼不一致';

          return;

        }


        message.textContent =
  '註冊中…';

        console.log('註冊資料：', {
  name: name,
  account: account,
  password: password
});
        
try {

  const requestData = {
  action: 'registerFanFlow',
  name: name,
  account: account,
  password: password
};

console.log('送出的註冊資料：', requestData);

const response =
  await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(requestData)
  });

  const result =
    await response.json();

  if (!result.success) {
    throw new Error(
      result.message || '註冊失敗'
    );
  }

  message.textContent =
    '✅ 註冊成功！';

} catch (error) {

  console.error(
    'FanFlow 註冊失敗：',
    error
  );

  message.textContent =
    '❌ ' + error.message;

}

      });

</script>


</body>

</html>
