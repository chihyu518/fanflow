<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>周邊代購｜FanFlow</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans TC", sans-serif;
      background: #f6f7fb;
      color: #222;
    }

    /* ========================
       左側選單
    ======================== */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 230px;
      height: 100vh;
      background: white;
      border-right: 1px solid #e8e8e8;
      padding: 24px 16px;
      z-index: 100;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 35px;
      padding: 0 10px;
    }

    .logo span {
      color: #5c63ff;
    }

    .menu-item {
      display: block;
      padding: 13px 14px;
      margin-bottom: 6px;
      border-radius: 10px;
      cursor: pointer;
      color: #555;
      text-decoration: none;
    }

    .menu-item.active {
      background: #eef0ff;
      color: #4d55e8;
      font-weight: 700;
    }

    .menu-item:hover {
      background: #f3f4f8;
    }


    /* ========================
       主畫面
    ======================== */

    .main {
      margin-left: 230px;
      padding: 40px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      margin-top: 8px;
      color: #888;
    }


    /* ========================
       建立代購按鈕
    ======================== */

    .create-button {
      border: none;
      background: #5360f5;
      color: white;
      padding: 13px 20px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .create-button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }


    /* ========================
       代購區塊
    ======================== */

    .section {
      margin-top: 38px;
    }

    .section-title {
      font-size: 19px;
      font-weight: 750;
      margin-bottom: 16px;
    }

    .empty-box {
      background: white;
      min-height: 150px;
      border-radius: 16px;
      padding: 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      color: #aaa;

      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    }

    /* ========================
   代購卡片
======================== */

.groupbuy-grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(260px, 1fr));
  gap: 18px;
}

.groupbuy-card {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
}

.groupbuy-image {
  width: 100%;
  height: 180px;
  object-fit: cover;
  display: block;
}

.groupbuy-content {
  padding: 18px;
}

.groupbuy-name {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 8px;
}

.groupbuy-group {
  font-size: 14px;
  color: #666;
  margin-bottom: 12px;
}

.groupbuy-deadline {
  font-size: 13px;
  color: #888;
  margin-bottom: 10px;
}

.groupbuy-note {
  font-size: 14px;
  color: #555;
  line-height: 1.6;
}
    

    /* ========================
       Modal 背景
    ======================== */

    .modal {
      display: none;
      position: fixed;

      z-index: 1000;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      padding: 30px 20px;

      background: rgba(0, 0, 0, 0.35);

      overflow-y: auto;
    }


    /* ========================
       Modal 白色視窗
    ======================== */

    .modal-box {
      width: 100%;
      max-width: 520px;

      margin: 40px auto;

      background: white;

      border-radius: 18px;
      padding: 26px;

      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
    }


    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 24px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 22px;
    }


    /* X */

    .close-button {
      border: none;
      background: transparent;

      font-size: 28px;
      color: #888;

      cursor: pointer;

      padding: 0;
      line-height: 1;
    }

    .close-button:hover {
      color: #333;
    }


    /* ========================
       表單
    ======================== */

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 700;

      color: #444;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;

      border: 1px solid #ddd;
      border-radius: 10px;

      padding: 12px 13px;

      font-size: 15px;
      font-family: inherit;

      background: white;
      color: #333;

      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #6971f7;
      box-shadow: 0 0 0 3px rgba(105, 113, 247, 0.08);
    }

    .form-group textarea {
      resize: vertical;
    }


    /* ========================
       Modal 按鈕
    ======================== */

    .modal-actions {
      display: flex;
      justify-content: flex-end;

      gap: 10px;

      margin-top: 26px;
    }

    .cancel-button,
    .save-button {
      border: none;
      border-radius: 10px;

      padding: 11px 18px;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
    }

    .cancel-button {
      background: #f1f2f5;
      color: #555;
    }

    .save-button {
      background: #5360f5;
      color: white;
    }

    .cancel-button:hover,
    .save-button:hover {
      opacity: 0.9;
    }


    /* ========================
       平板／手機
    ======================== */

    @media (max-width: 800px) {

      .sidebar {
        width: 75px;
        padding: 20px 10px;
      }

      .logo {
        font-size: 18px;
        padding: 0;
        text-align: center;
      }

      .logo-text,
      .menu-text {
        display: none;
      }

      .menu-item {
        text-align: center;
      }

      .main {
        margin-left: 75px;
        padding: 22px;
      }

      .page-header {
        flex-direction: column;
      }

      .create-button {
        width: 100%;
      }
    }


    @media (max-width: 600px) {

      .modal {
        padding: 15px;
      }

      .modal-box {
        margin: 15px auto;
        padding: 22px 18px;
      }

      .modal-actions {
        flex-direction: column-reverse;
      }

      .cancel-button,
      .save-button {
        width: 100%;
      }
    }

  </style>
</head>


<body>


  <!-- ========================
       左側選單
  ======================== -->

  <aside class="sidebar">

    <div class="logo">
      💙
      <span class="logo-text">
        Fan<span>Flow</span>
      </span>
    </div>


    <a href="index.html" class="menu-item">
      🏠 <span class="menu-text">首頁</span>
    </a>


    <a href="groupbuy.html" class="menu-item active">
      🛍️ <span class="menu-text">周邊代購</span>
    </a>


    <div class="menu-item">
      🃏 <span class="menu-text">小卡交易</span>
    </div>


    <div class="menu-item">
      💰 <span class="menu-text">帳務中心</span>
    </div>


    <div class="menu-item">
      ♡ <span class="menu-text">收藏庫</span>
    </div>


    <div class="menu-item">
      👥 <span class="menu-text">成員管理</span>
    </div>


    <div class="menu-item">
      🔔 <span class="menu-text">通知中心</span>
    </div>


    <div class="menu-item">
      ⚙️ <span class="menu-text">設定</span>
    </div>

  </aside>


  <!-- ========================
       主畫面
  ======================== -->

  <main class="main">

    <div class="page-header">

      <div>

        <h1>周邊代購</h1>

        <div class="subtitle">
          集中管理開團登記、商品與付款
        </div>

      </div>


      <button
        class="create-button"
        type="button"
        onclick="openCreateModal()">

        ＋ 建立代購

      </button>

    </div>


<!-- 進行中 -->

<section class="section">

  <div class="section-title">
    進行中
  </div>

  <div id="activeGroupBuys">

    <div class="empty-box">
      載入中...
    </div>

  </div>

</section>

<!-- 已結束 -->

<section class="section">

  <div class="section-title">
    已結束
  </div>

  <div id="endedGroupBuys">

    <div class="empty-box">
      載入中...
    </div>

  </div>

</section>

  </main>



  <!-- ========================
       建立新代購 Modal
  ======================== -->

  <div
    id="createModal"
    class="modal">


    <div class="modal-box">


      <!-- 標題 -->

      <div class="modal-header">

        <h2>
          建立新代購
        </h2>


        <button
          class="close-button"
          type="button"
          onclick="closeCreateModal()">

          ×

        </button>

      </div>


<!-- 代購圖片 -->

<div class="form-group">

  <label for="groupBuyImage">
    代購圖片
  </label>

  <input
    id="groupBuyImage"
    type="file"
    accept="image/*">

</div>


<!-- 代購名稱 -->
      
      <!-- 代購名稱 -->

      <div class="form-group">

        <label for="groupBuyName">
          代購名稱
        </label>


        <input
          id="groupBuyName"
          type="text"
          placeholder="例如：BOYNEXTDOOR 官方周邊">

      </div>



      <!-- 團體 -->

      <div class="form-group">

        <label for="groupName">
          團體／活動
        </label>


        <input
          id="groupName"
          type="text"
          placeholder="例如：BOYNEXTDOOR">

      </div>



      <!-- 截止日 -->

      <div class="form-group">

        <label for="deadline">
          登記截止日
        </label>


        <input
          id="deadline"
          type="date">

      </div>



      <!-- 狀態 -->

      <div class="form-group">

        <label for="groupBuyStatus">
          狀態
        </label>


        <select id="groupBuyStatus">

          <option value="進行中">
            進行中
          </option>

          <option value="已結束">
            已結束
          </option>

        </select>

      </div>



      <!-- 備註 -->

      <div class="form-group">

        <label for="groupBuyNote">
          備註
        </label>


        <textarea
          id="groupBuyNote"
          rows="4"
          placeholder="例如：到貨後會再通知付款與取貨"></textarea>

      </div>



      <!-- 按鈕 -->

      <div class="modal-actions">

        <button
          class="cancel-button"
          type="button"
          onclick="closeCreateModal()">

          取消

        </button>


        <button
  class="save-button"
  type="button"
  onclick="saveGroupBuy()">

          建立代購

        </button>

      </div>


    </div>

  </div>



  <!-- ========================
       JavaScript
  ======================== -->

<script>
  
  const API_URL = 'https://script.google.com/macros/s/AKfycbz7CVrbddXxIvd86Z3PeMyM9MT6q7QBe7EJ5n1uQU7pTkwCYgc-4gjcg7EmRmz5itDSJQ/exec';

  // =========================
// 讀取周邊代購資料
// =========================

async function loadGroupBuys() {

  try {

    const response =
      await fetch(
        API_URL + '?action=getGroupBuys'
      );

    const result =
      await response.json();

    if (!result.success) {
      throw new Error(
        result.message || '讀取代購失敗'
      );
    }

    console.log(
      'FanFlow 代購資料：',
      result.data
    );

    renderGroupBuys(result.data);
    
  } catch (error) {

    console.error(
      '讀取代購失敗：',
      error
    );

  }

}

  // =========================
// 顯示周邊代購卡片
// =========================

function renderGroupBuys(groupBuys) {

  const activeContainer =
    document.getElementById('activeGroupBuys');

  const endedContainer =
    document.getElementById('endedGroupBuys');


  // 分成進行中／已結束
  const activeGroupBuys =
    groupBuys.filter(function(item) {
      return item.status === '🟢 進行中';
    });

  const endedGroupBuys =
    groupBuys.filter(function(item) {
      return item.status === '🔴 已結束';
    });


  // 產生卡片
  function createCards(items, emptyText) {

    if (items.length === 0) {

      return `
        <div class="empty-box">
          ${emptyText}
        </div>
      `;

    }


    const cards =
      items.map(function(item) {

        const imageHtml =
          item.imageUrl
            ? `
              <img
                class="groupbuy-image"
                src="${item.imageUrl}"
                alt="${item.name}">
            `
            : '';


        const deadlineHtml =
          item.deadline
            ? `
              <div class="groupbuy-deadline">
                📅 登記截止：${item.deadline}
              </div>
            `
            : '';


        const noteHtml =
          item.note
            ? `
              <div class="groupbuy-note">
                ${item.note}
              </div>
            `
            : '';


        return `
          <div class="groupbuy-card">

            ${imageHtml}

            <div class="groupbuy-content">

              <div class="groupbuy-name">
                ${item.name}
              </div>

              <div class="groupbuy-group">
                🎤 ${item.group || '未設定團體／活動'}
              </div>

              ${deadlineHtml}

              ${noteHtml}

            </div>

          </div>
        `;

      })
      .join('');


    return `
      <div class="groupbuy-grid">
        ${cards}
      </div>
    `;

  }


  activeContainer.innerHTML =
    createCards(
      activeGroupBuys,
      '目前沒有進行中的代購 ✨'
    );


  endedContainer.innerHTML =
    createCards(
      endedGroupBuys,
      '目前沒有已結束的代購'
    );

}
  
  function compressImage(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = function(event) {

      const img = new Image();

      img.onload = function() {

        const maxWidth = 1200;
        const maxHeight = 1200;

        let width = img.width;
        let height = img.height;

        if (width > maxWidth || height > maxHeight) {

          const ratio = Math.min(
            maxWidth / width,
            maxHeight / height
          );

          width = Math.round(width * ratio);
          height = Math.round(height * ratio);

        }

        const canvas = document.createElement('canvas');

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        const compressedData =
          canvas.toDataURL('image/jpeg', 0.8);

        resolve(compressedData);

      };

      img.onerror = function() {
        reject(new Error('圖片處理失敗'));
      };

      img.src = event.target.result;

    };

    reader.onerror = function() {
      reject(new Error('圖片讀取失敗'));
    };

    reader.readAsDataURL(file);

  });

}
  
async function saveGroupBuy() {

  const name =
    document.getElementById('groupBuyName').value.trim();

  const group =
    document.getElementById('groupName').value.trim();

  const deadline =
    document.getElementById('deadline').value;

  const statusValue =
    document.getElementById('groupBuyStatus').value;

  const note =
    document.getElementById('groupBuyNote').value.trim();

  const imageInput =
    document.getElementById('groupBuyImage');

  const imageFile =
    imageInput.files[0];


  // 代購名稱必填
  if (!name) {
    alert('請輸入代購名稱');
    return;
  }


  // 將網站狀態轉成 Notion 使用的名稱
  const status =
    statusValue === '已結束'
      ? '🔴 已結束'
      : '🟢 進行中';


  // 圖片資料
  let imageData = '';
  let imageName = '';
  let imageType = '';

  if (imageFile) {

    imageData =
      await compressImage(imageFile);

    imageName =
      'fanflow-' + Date.now() + '.jpg';

    imageType =
      'image/jpeg';

  }


  const data = {

    action: 'createGroupBuy',

    name: name,
    group: group,
    deadline: deadline,
    status: status,
    note: note,

    imageData: imageData,
    imageName: imageName,
    imageType: imageType

  };


  try {

    const response =
      await fetch(API_URL, {

        method: 'POST',

        body: JSON.stringify(data)

      });


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        '建立代購失敗'
      );

    }


    alert('建立代購成功！');

    document.getElementById('groupBuyImage').value = '';
    document.getElementById('groupBuyName').value = '';
    document.getElementById('groupName').value = '';
    document.getElementById('deadline').value = '';
    document.getElementById('groupBuyStatus').value = '進行中';
    document.getElementById('groupBuyNote').value = '';
    
    closeCreateModal();

    loadGroupBuys();

  } catch (error) {

    console.error(error);

    alert(
      '建立代購失敗：' +
      error.message
    );

  }

}
  
  const createModal = document.getElementById("createModal");

  // 開啟建立代購視窗
  function openCreateModal() {
    createModal.style.display = "block";
  }

  // 關閉建立代購視窗
  function closeCreateModal() {
    createModal.style.display = "none";
  }

  // 點擊灰色背景關閉
  createModal.addEventListener("click", function(event) {
    if (event.target === createModal) {
      closeCreateModal();
    }
  });

  // 按 ESC 關閉
  document.addEventListener("keydown", function(event) {
    if (
      event.key === "Escape" &&
      createModal.style.display === "block"
    ) {
      closeCreateModal();
    }
  });

  // =========================
// 網頁開啟時讀取代購資料
// =========================

loadGroupBuys();
  
</script>


</body>
