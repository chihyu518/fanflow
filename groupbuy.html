<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>周邊代購｜FanFlow</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans TC", sans-serif;
      background: #f6f7fb;
      color: #222;
    }

    /* ========================
       左側選單
    ======================== */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 230px;
      height: 100vh;
      background: white;
      border-right: 1px solid #e8e8e8;
      padding: 24px 16px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 35px;
      padding: 0 10px;
    }

    .logo span {
      color: #5c63ff;
    }

    .menu-item {
      display: block;
      padding: 13px 14px;
      margin-bottom: 6px;
      border-radius: 10px;
      cursor: pointer;
      color: #555;
      text-decoration: none;
    }

    .menu-item.active {
      background: #eef0ff;
      color: #4d55e8;
      font-weight: 700;
    }

    .menu-item:hover {
      background: #f3f4f8;
    }


    /* ========================
       主畫面
    ======================== */

    .main {
      margin-left: 230px;
      padding: 40px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      margin-top: 8px;
      color: #888;
    }


    /* ========================
       建立代購按鈕
    ======================== */

    .create-button {
      border: none;
      background: #5360f5;
      color: white;
      padding: 13px 20px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .create-button:hover {
      opacity: 0.9;
    }


    /* ========================
       區塊
    ======================== */

    .section {
      margin-top: 38px;
    }

    .section-title {
      font-size: 19px;
      font-weight: 750;
      margin-bottom: 16px;
    }

    .empty-box {
      background: white;
      min-height: 150px;
      border-radius: 16px;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #aaa;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }


    /* ========================
       手機版
    ======================== */

    @media (max-width: 800px) {

      .sidebar {
        width: 75px;
        padding: 20px 10px;
      }

      .logo {
        font-size: 18px;
        padding: 0;
        text-align: center;
      }

      .logo-text,
      .menu-text {
        display: none;
      }

      .menu-item {
        text-align: center;
      }

      .main {
        margin-left: 75px;
        padding: 22px;
      }

      .page-header {
        flex-direction: column;
      }

      .create-button {
        width: 100%;
      }
    }
  </style>
</head>


<body>

  <!-- 左側選單 -->

  <aside class="sidebar">

    <div class="logo">
      💙
      <span class="logo-text">
        Fan<span>Flow</span>
      </span>
    </div>


    <a href="index.html" class="menu-item">
      🏠 <span class="menu-text">首頁</span>
    </a>


    <a href="groupbuy.html" class="menu-item active">
      🛍️ <span class="menu-text">周邊代購</span>
    </a>


    <div class="menu-item">
      🃏 <span class="menu-text">小卡交易</span>
    </div>


    <div class="menu-item">
      💰 <span class="menu-text">帳務中心</span>
    </div>


    <div class="menu-item">
      ♡ <span class="menu-text">收藏庫</span>
    </div>


    <div class="menu-item">
      👥 <span class="menu-text">成員管理</span>
    </div>


    <div class="menu-item">
      🔔 <span class="menu-text">通知中心</span>
    </div>


    <div class="menu-item">
      ⚙️ <span class="menu-text">設定</span>
    </div>

  </aside>


  <!-- 主內容 -->

  <main class="main">

    <div class="page-header">

      <div>
        <h1>周邊代購</h1>

        <div class="subtitle">
          集中管理開團登記、商品與付款
        </div>
      </div>


<button class="create-button" onclick="openCreateModal()">
  ＋ 建立代購
</button>

    </div>


    <!-- 進行中 -->

    <section class="section">

      <div class="section-title">
        進行中
      </div>

      <div class="empty-box">
        目前沒有進行中的代購 ✨
      </div>

    </section>


    <!-- 已結束 -->

    <section class="section">

      <div class="section-title">
        已結束
      </div>

      <div class="empty-box">
        目前沒有已結束的代購
      </div>

    </section>

  </main>

</body>
</html>
