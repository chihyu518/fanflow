<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>周邊代購｜FanFlow</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans TC", sans-serif;
      background: #f6f7fb;
      color: #222;
    }


    /* ========================
       左側選單
    ======================== */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 230px;
      height: 100vh;
      background: white;
      border-right: 1px solid #e8e8e8;
      padding: 24px 16px;
      z-index: 100;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 35px;
      padding: 0 10px;
    }

    .logo span {
      color: #5c63ff;
    }

    .menu-item {
      display: block;
      padding: 13px 14px;
      margin-bottom: 6px;
      border-radius: 10px;
      cursor: pointer;
      color: #555;
      text-decoration: none;
    }

    .menu-item.active {
      background: #eef0ff;
      color: #4d55e8;
      font-weight: 700;
    }

    .menu-item:hover {
      background: #f3f4f8;
    }


    /* ========================
       主畫面
    ======================== */

    .main {
      margin-left: 230px;
      padding: 40px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      margin-top: 8px;
      color: #888;
    }


    /* ========================
       建立代購按鈕
    ======================== */

    .create-button {
      border: none;
      background: #5360f5;
      color: white;
      padding: 13px 20px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .create-button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }


    /* ========================
       代購區塊
    ======================== */

    .section {
      margin-top: 38px;
    }

    .section-title {
      font-size: 19px;
      font-weight: 750;
      margin-bottom: 16px;
    }

    .empty-box {
      background: white;
      min-height: 150px;
      border-radius: 16px;
      padding: 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      color: #aaa;

      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    }


    /* ========================
       代購卡片
    ======================== */

    .groupbuy-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .groupbuy-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      cursor: pointer;
    }

    .groupbuy-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .groupbuy-content {
      padding: 18px;
    }

    .groupbuy-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .groupbuy-group {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }

    .groupbuy-deadline {
      font-size: 13px;
      color: #888;
      margin-bottom: 10px;
    }

    .groupbuy-note {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
    }


    /* ========================
       Modal 背景
    ======================== */

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      padding: 30px 20px;
      background: rgba(0, 0, 0, 0.35);
      overflow-y: auto;
    }

    /* 商品 Modal 顯示在詳細資料上方 */
#productModal,
#orderModal {
  z-index: 2000;
}


    /* ========================
       Modal 白色視窗
    ======================== */

    .modal-box {
      width: 100%;
      max-width: 520px;
      margin: 40px auto;
      background: white;
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .close-button {
      border: none;
      background: transparent;
      font-size: 28px;
      color: #888;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .close-button:hover {
      color: #333;
    }


    /* ========================
       表單
    ======================== */

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #444;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px 13px;
      font-size: 15px;
      font-family: inherit;
      background: white;
      color: #333;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #6971f7;
      box-shadow: 0 0 0 3px rgba(105, 113, 247, 0.08);
    }

    .form-group textarea {
      resize: vertical;
    }


    /* ========================
       Modal 按鈕
    ======================== */

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 26px;
    }

    .cancel-button,
    .save-button {
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .cancel-button {
      background: #f1f2f5;
      color: #555;
    }

    .save-button {
      background: #5360f5;
      color: white;
    }

    .cancel-button:hover,
    .save-button:hover {
      opacity: 0.9;
    }


    /* ========================
       平板／手機
    ======================== */

    @media (max-width: 800px) {

      .sidebar {
        width: 75px;
        padding: 20px 10px;
      }

      .logo {
        font-size: 18px;
        padding: 0;
        text-align: center;
      }

      .logo-text,
      .menu-text {
        display: none;
      }

      .menu-item {
        text-align: center;
      }

      .main {
        margin-left: 75px;
        padding: 22px;
      }

      .page-header {
        flex-direction: column;
      }

      .create-button {
        width: 100%;
      }
    }


    @media (max-width: 600px) {

      .modal {
        padding: 15px;
      }

      .modal-box {
        margin: 15px auto;
        padding: 22px 18px;
      }

      .modal-actions {
        flex-direction: column-reverse;
      }

      .cancel-button,
      .save-button {
        width: 100%;
      }
    }

  </style>
</head>

  <!-- ========================

  <script>

    const API_URL =
      'https://script.google.com/macros/s/AKfycbz7CVrbddXxIvd86Z3PeMyM9MT6q7QBe7EJ5n1uQU7pTkwCYgc-4gjcg7EmRmz5itDSJQ/exec';


    // =========================
    // 讀取周邊代購資料
    // =========================

    async function loadGroupBuys() {

      try {

        const response =
          await fetch(
            API_URL + '?action=getGroupBuys'
          );

        const result =
          await response.json();

        if (!result.success) {

          throw new Error(
            result.message ||
            '讀取代購失敗'
          );

        }

        window.currentGroupBuys =
          result.data || [];

        renderGroupBuys(
          window.currentGroupBuys
        );

      } catch (error) {

        console.error(
          '讀取代購失敗：',
          error
        );

      }

    }


    // =========================
    // 顯示周邊代購卡片
    // =========================

    function renderGroupBuys(groupBuys) {

      const activeContainer =
        document.getElementById(
          'activeGroupBuys'
        );

      const endedContainer =
        document.getElementById(
          'endedGroupBuys'
        );


      const activeGroupBuys =
        groupBuys.filter(function(item) {

          return item.status ===
            '🟢 進行中';

        });


      const endedGroupBuys =
        groupBuys.filter(function(item) {

          return item.status ===
            '🔴 已結束';

        });


      function createCards(
        items,
        emptyText
      ) {

        if (items.length === 0) {

          return `
            <div class="empty-box">
              ${emptyText}
            </div>
          `;

        }


        const cards =
          items.map(function(item) {

            const imageHtml =
              item.imageUrl
                ? `
                  <img
                    class="groupbuy-image"
                    src="${item.imageUrl}"
                    alt="${item.name}">
                `
                : '';


            const deadlineHtml =
              item.deadline
                ? `
                  <div class="groupbuy-deadline">
                    📅 登記截止：${item.deadline}
                  </div>
                `
                : '';


            const noteHtml =
              item.note
                ? `
                  <div class="groupbuy-note">
                    ${item.note}
                  </div>
                `
                : '';


            return `
              <div
                class="groupbuy-card"
                onclick="openGroupBuyDetail('${item.id}')">

                ${imageHtml}

                <div class="groupbuy-content">

                  <div class="groupbuy-name">
                    ${item.name}
                  </div>

                  <div class="groupbuy-group">
                    🎤 ${item.group || '未設定團體／活動'}
                  </div>

                  ${deadlineHtml}

                  ${noteHtml}

                </div>

              </div>
            `;

          })
          .join('');


        return `
          <div class="groupbuy-grid">
            ${cards}
          </div>
        `;

      }


      activeContainer.innerHTML =
        createCards(
          activeGroupBuys,
          '目前沒有進行中的代購 ✨'
        );


      endedContainer.innerHTML =
        createCards(
          endedGroupBuys,
          '目前沒有已結束的代購'
        );

    }


    // =========================
    // 開啟代購詳細資料
    // =========================

    function openGroupBuyDetail(id) {

      const item =
        window.currentGroupBuys.find(
          function(groupBuy) {

            return groupBuy.id === id;

          }
        );


      if (!item) {

        alert(
          '找不到這筆代購資料'
        );

        return;

      }


      window.currentGroupBuyId = id;


      const modal =
        document.getElementById(
          'groupBuyDetailModal'
        );


      const content =
        document.getElementById(
          'groupBuyDetailContent'
        );


      const imageHtml =
        item.imageUrl
          ? `
            <img
              src="${item.imageUrl}"
              alt="${item.name}"
              style="
                width: 100%;
                max-height: 320px;
                object-fit: cover;
                border-radius: 14px;
                margin-bottom: 20px;
              ">
          `
          : '';


      content.innerHTML = `

        ${imageHtml}

        <div
          style="
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 18px;
          ">
          ${item.name}
        </div>

        <div style="margin-bottom: 12px;">

async function saveProduct() {

  const name =
    document
      .getElementById('productName')
      .value
      .trim();


  const price =
    document
      .getElementById('productPrice')
      .value;


  const sort =
    document
      .getElementById('productSort')
      .value;


  const note =
    document
      .getElementById('productNote')
      .value
      .trim();


  const imageInput =
    document.getElementById(
      'productImage'
    );


  const imageFile =
    imageInput.files[0];


  // 判斷現在是新增還是修改
  const isEditing =
    !!window.editingProductId;


  if (!name) {

    alert('請輸入商品名稱');

    return;

  }


  if (!window.currentGroupBuyId) {

    alert('找不到目前的代購資料');

    return;

  }


  // =========================
  // 處理商品圖片
  // =========================

  let imageData = '';
  let imageName = '';
  let imageType = '';


  if (imageFile) {

    imageData =
      await compressImage(
        imageFile
      );


    imageName =
      'product-' +
      Date.now() +
      '.jpg';


    imageType =
      'image/jpeg';

  }


  // =========================
  // 準備送到 GAS
  // =========================

  const data = {

    action:
      isEditing
        ? 'updateProduct'
        : 'createProduct',

    id:
      isEditing
        ? window.editingProductId
        : '',

    groupBuyId:
      window.currentGroupBuyId,

    name:
      name,

    price:
      price,

    sort:
      sort,

    note:
      note,

    imageData:
      imageData,

    imageName:
      imageName,

    imageType:
      imageType

  };


  const saveButton =
    document.getElementById(
      'productSaveButton'
    );


  try {

    saveButton.disabled =
      true;


    saveButton.textContent =
      isEditing
        ? '儲存中...'
        : '新增中...';


    const response =
      await fetch(
        API_URL,
        {

          method:
            'POST',

          body:
            JSON.stringify(data)

        }
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        (
          isEditing
            ? '修改商品失敗'
            : '新增商品失敗'
        )
      );

    }


    alert(
      isEditing
        ? '修改商品成功！'
        : '新增商品成功！'
    );


    // 離開編輯模式
    window.editingProductId =
      '';


    closeProductModal();


    // =========================
    // 清空商品表單
    // =========================

    document
      .getElementById(
        'productImage'
      )
      .value = '';


    document
      .getElementById(
        'productName'
      )
      .value = '';


    document
      .getElementById(
        'productPrice'
      )
      .value = '';


    document
      .getElementById(
        'productSort'
      )
      .value = '0';


    document
      .getElementById(
        'productNote'
      )
      .value = '';


    document
      .getElementById(
        'productModalTitle'
      )
      .textContent =
        '新增商品';


    // 等 Notion 更新後重新讀取商品
    setTimeout(
      function() {

        loadProducts(
          window.currentGroupBuyId
        );

      },
      1000
    );


  } catch (error) {

    console.error(
      isEditing
        ? '修改商品失敗：'
        : '新增商品失敗：',
      error
    );


    alert(
      (
        isEditing
          ? '修改商品失敗：'
          : '新增商品失敗：'
      ) +
      error.message
    );


  } finally {

    saveButton.disabled =
      false;


    saveButton.textContent =
      isEditing
        ? '儲存修改'
        : '新增商品';

  }

}

async function loadOrders(groupBuyName) {

  const orderList =
    document.getElementById('orderList');

  if (!orderList) {
    return;
  }


  orderList.innerHTML =
    '<div class="empty">讀取登記資料中...</div>';


  try {

    const response =
      await fetch(
        API_URL +
        '?action=getOrders&groupBuyName=' +
        encodeURIComponent(groupBuyName)
      );


    const result =
      await response.json();


    if (!result.success) {
      throw new Error(
        result.message ||
        '讀取登記資料失敗'
      );
    }


    const orders =
      result.data || [];


    if (orders.length === 0) {

      orderList.innerHTML =
        '<div class="empty">尚無登記資料</div>';

      return;

    }


    orderList.innerHTML =
      orders.map(function(order) {

        return `
          <div class="product-card">

            <div class="product-info">

              <strong>
                👤 ${escapeHtml(order.name)}
              </strong>

              <div>
                📦 ${escapeHtml(order.product)}
                × ${order.quantity}
              </div>

              <div>
                💲單價 NT$${Number(order.price).toLocaleString()}
              </div>

              ${
                Number(order.secondPayment) > 0
                  ? `
                    <div>
                      💰二補 NT$${Number(order.secondPayment).toLocaleString()}
                    </div>
                  `
                  : ''
              }

              <div>
                <strong>

                </strong>
              </div>

              <div>
                ${escapeHtml(order.paymentStatus)}
              </div>

            </div>

          </div>
        `;

      }).join('');


  } catch (error) {

      '讀取登記資料失敗：',
      error
    );

    orderList.innerHTML =
      '<div class="empty">讀取登記資料失敗</div>';

  }

}

<button

function calculateOrderTotal() {

  const quantity =
    Number(
      document
        .getElementById(
          'orderQuantity'
        )
        .value
    ) || 0;


  const price =
    Number(
      document
        .getElementById(
          'orderPrice'
        )
        .value
    ) || 0;


  const secondPayment =
    Number(
      document
        .getElementById(
          'orderSecondPayment'
        )
        .value
    ) || 0;


  const total =
    quantity * price +
    secondPayment;


  document
    .getElementById(
      'orderTotal'
    )
    .value =
      total;

}

                  id:
                    id

                })

            }
          );


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.message ||
            '刪除代購失敗'
          );

        }


        alert(
          '刪除代購成功！'
        );


        closeGroupBuyDetail();


        setTimeout(
          function() {

            loadGroupBuys();

          },
          1500
        );


      } catch (error) {

        console.error(error);


        alert(
          '刪除代購失敗：' +
          error.message
        );

      }

    }


    // =========================
    // 圖片壓縮
    // =========================

    function compressImage(file) {

      return new Promise(
        (
          resolve,
          reject
        ) => {

          const reader =
            new FileReader();


          reader.onload =
            function(event) {

              const img =
                new Image();


              img.onload =
                function() {

                  const maxWidth =
                    1200;

                  const maxHeight =
                    1200;


                  let width =
                    img.width;

                  let height =
                    img.height;


                  if (
                    width > maxWidth ||
                    height > maxHeight
                  ) {

                    const ratio =
                      Math.min(
                        maxWidth / width,
                        maxHeight / height
                      );


                    width =
                      Math.round(
                        width * ratio
                      );


                    height =
                      Math.round(
                        height * ratio
                      );

                  }


                  const canvas =
                    document.createElement(
                      'canvas'
                    );


                  canvas.width =
                    width;

                  canvas.height =
                    height;


                  const ctx =
                    canvas.getContext(
                      '2d'
                    );


                  ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                  );


                  const compressedData =
                    canvas.toDataURL(
                      'image/jpeg',
                      0.8
                    );


                  resolve(
                    compressedData
                  );

                };


              img.onerror =
                function() {

                  reject(
                    new Error(
                      '圖片處理失敗'
                    )
                  );

                };


              img.src =
                event.target.result;

            };


          reader.onerror =
            function() {

              reject(
                new Error(
                  '圖片讀取失敗'
                )
              );

            };


          reader.readAsDataURL(
            file
          );

        }
      );

    }
        // =========================
    // 儲存代購
    // =========================

    async function saveGroupBuy() {

      const name =
        document
          .getElementById('groupBuyName')
          .value
          .trim();


      const group =
        document
          .getElementById('groupName')
          .value
          .trim();


      const deadline =
        document
          .getElementById('deadline')
          .value;


      const statusValue =
        document
          .getElementById('groupBuyStatus')
          .value;


      const note =
        document
          .getElementById('groupBuyNote')
          .value
          .trim();


      const imageInput =
        document.getElementById(
          'groupBuyImage'
        );


      const imageFile =
        imageInput.files[0];


      // 判斷是不是編輯模式
      const isEditing =
        !!window.editingGroupBuyId;


      // 代購名稱必填
      if (!name) {

        alert('請輸入代購名稱');

        return;

      }


      // 網站狀態轉成 Notion 狀態
      const status =
        statusValue === '已結束'
          ? '🔴 已結束'
          : '🟢 進行中';


      // =========================
      // 圖片處理
      // =========================

      let imageData = '';
      let imageName = '';
      let imageType = '';


      if (imageFile) {

        imageData =
          await compressImage(
            imageFile
          );


        imageName =
          'fanflow-' +
          Date.now() +
          '.jpg';


        imageType =
          'image/jpeg';

      }


      // =========================
      // 準備送到 GAS
      // =========================

      const data = {

        action:
          isEditing
            ? 'updateGroupBuy'
            : 'createGroupBuy',

        id:
          isEditing
            ? window.editingGroupBuyId
            : '',

        name:
          name,

        group:
          group,

        deadline:
          deadline,

        status:
          status,

        note:
          note,

        imageData:
          imageData,

        imageName:
          imageName,

        imageType:
          imageType

      };


      try {

        const response =
          await fetch(
            API_URL,
            {

              method:
                'POST',

              body:
                JSON.stringify(data)

            }
          );


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.message ||
            (
              isEditing
                ? '修改代購失敗'
                : '建立代購失敗'
            )
          );

        }


        if (isEditing) {

          alert(
            '修改代購成功！'
          );

        } else {

          alert(
            '建立代購成功！'
          );

        }


        // 清空表單
        document
          .getElementById(
            'groupBuyImage'
          )
          .value = '';


        document
          .getElementById(
            'groupBuyName'
          )
          .value = '';


        document
          .getElementById(
            'groupName'
          )
          .value = '';


        document
          .getElementById(
            'deadline'
          )
          .value = '';


        document
          .getElementById(
            'groupBuyStatus'
          )
          .value =
            '進行中';


        document
          .getElementById(
            'groupBuyNote'
          )
          .value = '';


        // 離開編輯模式
        window.editingGroupBuyId =
          '';


        document
          .getElementById(
            'groupBuySaveButton'
          )
          .textContent =
            '建立代購';


        closeCreateModal();


        // 等 Notion 更新後重新讀取
        setTimeout(
          function() {

            loadGroupBuys();

          },
          1500
        );


      } catch (error) {

        console.error(error);


        alert(
          (
            isEditing
              ? '修改代購失敗：'
              : '建立代購失敗：'
          ) +
          error.message
        );

      }

    }


    // =========================
    // 開啟全新的代購
    // =========================

    function openNewGroupBuy() {

      // 清除編輯模式
      window.editingGroupBuyId =
        '';


      // 清空表單
      document
        .getElementById(
          'groupBuyImage'
        )
        .value = '';


      document
        .getElementById(
          'groupBuyName'
        )
        .value = '';


      document
        .getElementById(
          'groupName'
        )
        .value = '';


      document
        .getElementById(
          'deadline'
        )
        .value = '';


      document
        .getElementById(
          'groupBuyStatus'
        )
        .value =
          '進行中';


      document
        .getElementById(
          'groupBuyNote'
        )
        .value = '';


      document
        .getElementById(
          'groupBuySaveButton'
        )
        .textContent =
          '建立代購';


      openCreateModal();

    }


    // =========================
    // Modal 基本控制
    // =========================

    const createModal =
      document.getElementById(
        'createModal'
      );


    const groupBuyDetailModal =
      document.getElementById(
        'groupBuyDetailModal'
      );


    const productModal =
      document.getElementById(
        'productModal'
      );

    const orderModal =
  document.getElementById(
    'orderModal'
  );


    // 開啟建立代購視窗
    function openCreateModal() {

      createModal.style.display =
        'block';

    }


    // 關閉建立代購視窗
    function closeCreateModal() {

      createModal.style.display =
        'none';

    }


    // =========================
    // 點灰色背景關閉
    // =========================

    createModal.addEventListener(
      'click',
      function(event) {

        if (
          event.target ===
          createModal
        ) {

          closeCreateModal();

        }

      }
    );


    groupBuyDetailModal
      .addEventListener(
        'click',
        function(event) {

          if (
            event.target ===
            groupBuyDetailModal
          ) {

            closeGroupBuyDetail();

          }

        }
      );


    productModal.addEventListener(
      'click',
      function(event) {

        if (
          event.target ===
          productModal
        ) {

          closeProductModal();

        }

      }
    );

    orderModal.addEventListener(
  'click',
  function(event) {

    if (
      event.target ===
      orderModal
    ) {

      closeOrderModal();

    }

  }
);
    

    // =========================
    // ESC 關閉視窗
    // =========================

    document.addEventListener(
      'keydown',
      function(event) {

        if (
          event.key !== 'Escape'
        ) {

          return;

        }


        // 商品 Modal 在最上層，
        // 所以先關商品 Modal
        if (
  orderModal.style.display ===
  'block'
) {

  closeOrderModal();

  return;

}
        if (
          productModal.style.display ===
          'block'
        ) {

          closeProductModal();

          return;

        }


        if (
          createModal.style.display ===
          'block'
        ) {

          closeCreateModal();

          return;

        }


        if (
          groupBuyDetailModal
            .style.display ===
          'block'
        ) {

          closeGroupBuyDetail();

        }

      }
    );


    // =========================
    // 網頁開啟時讀取資料
    // =========================

    loadGroupBuys();


  </script>
