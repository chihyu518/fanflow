<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FanFlow 登入</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        linear-gradient(
          135deg,
          #f7f5ff,
          #eef1ff
        );

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      color: #333;
    }

    .login-card {
      width: 100%;
      max-width: 420px;

      background: white;

      padding: 38px 32px;

      border-radius: 22px;

      box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;

      padding: 13px 15px;

      border: 1px solid #ddd;
      border-radius: 11px;

      font-size: 15px;

      outline: none;

      transition: 0.2s;
    }

    input:focus {
      border-color: #5865f2;

      box-shadow:
        0 0 0 3px
        rgba(88, 101, 242, 0.10);
    }

    .login-button {
      width: 100%;

      margin-top: 8px;

      padding: 13px;

      border: none;
      border-radius: 11px;

      background: #5865f2;
      color: white;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      transition: 0.2s;
    }

    .login-button:hover {
      transform: translateY(-1px);

      box-shadow:
        0 6px 15px
        rgba(88, 101, 242, 0.25);
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      min-height: 20px;

      margin-top: 18px;

      text-align: center;

      font-size: 14px;
      font-weight: 500;
    }

    .footer {
      margin-top: 28px;

      text-align: center;

      color: #aaa;
      font-size: 12px;
    }

  </style>

</head>


<body>

  <div class="login-card">

    <div class="logo">
      FanFlow 💜
    </div>

    <div class="subtitle">
      登入你的 FanFlow 帳號
    </div>


    <form id="loginForm">

      <div class="form-group">

        <label for="loginAccount">
          登入帳號
        </label>

        <input
          id="loginAccount"
          type="text"
          autocomplete="username"
          placeholder="請輸入登入帳號"
          required
        >

      </div>


      <div class="form-group">

        <label for="loginPassword">
          密碼
        </label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="請輸入密碼"
          required
        >

      </div>


      <button
        class="login-button"
        id="loginButton"
        type="submit"
      >
        登入
      </button>


      <div
        class="message"
        id="loginMessage"
      ></div>

    </form>


    <div class="footer">
      FanFlow
    </div>

  </div>


<script>

  const API_URL =
    'https://script.google.com/macros/s/AKfycbz7CVrbddXxIvd86Z3PeMyM9MT6q7QBe7EJ5n1uQU7pTkwCYgc-4gjcg7EmRmz5itDSJQ/exec';


  const loginForm =
    document.getElementById(
      'loginForm'
    );

  const loginButton =
    document.getElementById(
      'loginButton'
    );

  const loginMessage =
    document.getElementById(
      'loginMessage'
    );


  loginForm.addEventListener(
    'submit',
    async function(event) {

      event.preventDefault();


      const account =
        document.getElementById(
          'loginAccount'
        ).value.trim();

      const password =
        document.getElementById(
          'loginPassword'
        ).value;


      if (!account || !password) {

        loginMessage.textContent =
          '請輸入帳號與密碼';

        return;

      }


      loginButton.disabled = true;

      loginButton.textContent =
        '登入中...';

      loginMessage.textContent =
        '';


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: 'POST',

              body:
                JSON.stringify({
                  action:
                    'loginFanFlow',

                  account:
                    account,

                  password:
                    password
                })
            }
          );


        const result =
          await response.json();


        if (!result.success) {

          loginMessage.textContent =
            result.message ||
            '登入失敗';

          return;

        }


        // =========================
        // 🔑 儲存登入 Session
        // =========================

        sessionStorage.setItem(
          'fanflowSessionToken',
          result.token
        );

        sessionStorage.setItem(
          'fanflowUser',
          JSON.stringify(
            result.user
          )
        );


        loginMessage.textContent =
          '登入成功 ✨';


        // =========================
        // 🏠 前往 FanFlow 首頁
        // =========================

        window.location.href =
          'index.html';


      } catch (error) {

        console.error(error);

        loginMessage.textContent =
          '登入失敗，請稍後再試';

      } finally {

        loginButton.disabled = false;

        loginButton.textContent =
          '登入';

      }

    }
  );

</script>

</body>

</html>
