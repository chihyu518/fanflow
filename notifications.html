<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FanFlow｜通知中心</title>
  
  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      background: #f6f7fb;
      color: #222;
    }

    /* =========================
       左側選單
    ========================= */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 230px;
      background: white;
      border-right: 1px solid #eeeeee;
      padding: 24px 16px;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 30px;
      padding-left: 12px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      margin-bottom: 6px;
      border-radius: 12px;
      color: #555;
      text-decoration: none;
      font-size: 15px;
    }

    .menu-item:hover {
      background: #f5f6fa;
    }

    .menu-item.active {
      background: #eef1ff;
      color: #4056d6;
      font-weight: 700;
    }


    /* =========================
       主畫面
    ========================= */

    .main {
      margin-left: 230px;
      padding: 35px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .page-title {
      margin: 0;
      font-size: 28px;
    }

    .page-subtitle {
      margin-top: 7px;
      color: #888;
      font-size: 14px;
    }

    .add-button {
      border: none;
      background: #4056d6;
      color: white;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }


    /* =========================
       統計卡
    ========================= */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #eeeeee;
    }

    .stat-label {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 25px;
      font-weight: 800;
    }


    /* =========================
       搜尋／篩選
    ========================= */

    .toolbar {
      background: white;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-button {
      border: 1px solid #dddddd;
      background: white;
      padding: 8px 13px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    .filter-button.active {
      background: #4056d6;
      border-color: #4056d6;
      color: white;
    }


    /* =========================
       小卡區
    ========================= */

    .card-grid {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 18px;
    }

    .trade-card {
      background: white;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      overflow: hidden;
    }

    .trade-image {
      width: 100%;
      height: 230px;
      object-fit: cover;
      background: #f1f2f6;
    }

    .trade-placeholder {
      height: 230px;
      background: #f1f2f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .trade-body {
      padding: 16px;
    }

    .trade-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .trade-detail {
      color: #666;
      font-size: 14px;
      margin-top: 6px;
    }

    .empty-box {
      grid-column: 1 / -1;
      background: white;
      border: 1px dashed #d8d8d8;
      border-radius: 16px;
      padding: 60px 20px;
      text-align: center;
      color: #888;
    }


    /* =========================
       手機版
    ========================= */

    @media (max-width: 800px) {

      .sidebar {
        width: 75px;
        padding:
          24px 10px;
      }

      .logo {
        font-size: 0;
        padding-left: 10px;
      }

      .logo::after {
        content: "F";
        font-size: 24px;
      }

      .menu-text {
        display: none;
      }

      .menu-item {
        justify-content: center;
        font-size: 20px;
      }

      .main {
        margin-left: 75px;
        padding: 20px;
      }

      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .card-grid {
        grid-template-columns: 1fr;
      }

    }

    /* =========================
   🃏 小卡新增／編輯視窗
========================= */

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.38);
  z-index: 1000;
  padding: 30px 20px;
  overflow-y: auto;
}

.modal-overlay.show {
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.modal-box {
  width: 100%;
  max-width: 620px;
  background: white;
  border-radius: 18px;
  padding: 24px;
  margin: auto;
  box-shadow:
    0 18px 50px
    rgba(0, 0, 0, 0.18);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 22px;
}

.modal-header h2 {
  margin: 0;
  font-size: 22px;
}

.modal-close {
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 10px;
  background: #f3f4f8;
  font-size: 24px;
  cursor: pointer;
  line-height: 1;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  margin-bottom: 7px;
  font-size: 14px;
  font-weight: 700;
  color: #444;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  border: 1px solid #dddddd;
  border-radius: 10px;
  padding: 11px 12px;
  font-size: 15px;
  font-family: inherit;
  background: white;
  outline: none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: #4056d6;
}

.form-group textarea {
  resize: vertical;
}

.form-row {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 24px;
}

.cancel-button,
.save-button {
  border: none;
  border-radius: 10px;
  padding: 11px 18px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.cancel-button {
  background: #f0f1f5;
  color: #555;
}

.save-button {
  background: #4056d6;
  color: white;
}

@media (max-width: 600px) {

  .modal-overlay {
    padding: 15px;
  }

  .modal-box {
    padding: 20px;
  }

  .form-row {
    grid-template-columns: 1fr;
    gap: 0;
  }

}

    /* =========================
   ✏️ 小卡操作按鈕
========================= */

.trade-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.edit-trade-button {
  width: 100%;
  border: none;
  border-radius: 9px;
  padding: 9px 12px;
  background: #f0f2ff;
  color: #4056d6;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.edit-trade-button:hover {
  background: #e4e8ff;
}

    .delete-trade-button {
  width: 100%;
  border: none;
  border-radius: 9px;
  padding: 9px 12px;
  background: #fff0f0;
  color: #d64545;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.delete-trade-button:hover {
  background: #ffe2e2;
}

    /* =========================
   💳 可點擊狀態
========================= */

.status-clickable {
  cursor: pointer;
  border-radius: 8px;
  padding: 4px 6px;
  margin-left: -6px;
  transition: 0.2s;
}

.status-clickable:hover {
  background: #f1f3f9;
}
    
  </style>

</head>


<body>

  <!-- 左側選單 -->

  <aside class="sidebar">

    <div class="logo">
      FanFlow
    </div>

    <a
      href="index.html"
      class="menu-item"
    >
      🏠
      <span class="menu-text">
        首頁
      </span>
    </a>

    <a
      href="groupbuy.html"
      class="menu-item"
    >
      🛍️
      <span class="menu-text">
        周邊代購
      </span>
    </a>

    <a
      href="cardtrade.html"
      class="menu-item"
    >
      🃏
      <span class="menu-text">
        小卡交易
      </span>
    </a>

    <a
      href="finance.html"
      class="menu-item"
    >
      💰
      <span class="menu-text">
        帳務中心
      </span>
    </a>

    <a
  href="collection.html"
  class="menu-item"
>
  ♡
  <span class="menu-text">
    收藏庫
  </span>
</a>

    <a
  href="members.html"
  class="menu-item"
>
  👥
  <span class="menu-text">
    成員管理
  </span>
</a>

    <a
  href="notifications.html"
  class="menu-item active"
>
  🔔
  <span class="menu-text">
    通知中心
  </span>
</a>

    <a
      href="#"
      class="menu-item"
    >
      ⚙️
      <span class="menu-text">
        設定
      </span>
    </a>

  </aside>


 <!-- 主畫面 -->

<main class="main">

  <div class="page-header">

    <div>

      <h1 class="page-title">
        🔔 通知中心
      </h1>

      <div class="page-subtitle">
        集中查看需要處理的代購與交易提醒
      </div>

    </div>

  </div>


    <!-- 統計 -->

<div class="stats">

  <div class="stat-card">

    <div class="stat-label">
      🔔 待處理提醒
    </div>

    <div
      class="stat-number"
      id="totalNotificationCount"
    >
      0
    </div>

  </div>


  <div class="stat-card">

    <div class="stat-label">
      💳 未付款
    </div>

    <div
      class="stat-number"
      id="unpaidNotificationCount"
    >
      0
    </div>

  </div>


  <div class="stat-card">

    <div class="stat-label">
      📦 待交付
    </div>

    <div
      class="stat-number"
      id="deliveryNotificationCount"
    >
      0
    </div>

  </div>


  <div class="stat-card">

    <div class="stat-label">
      ⏰ 即將截止
    </div>

    <div
      class="stat-number"
      id="deadlineNotificationCount"
    >
      0
    </div>

  </div>

</div>

<!-- 搜尋與篩選 -->

<div class="toolbar">

  <input
    class="search-input"
    id="notificationSearch"
    type="text"
    placeholder="🔍 搜尋姓名、代購、商品..."
  >

  <div class="filter-row">

    <button
      class="filter-button active"
      data-type="all"
      onclick="setNotificationFilter(this)"
    >
      全部
    </button>

    <button
      class="filter-button"
      data-type="unpaid"
      onclick="setNotificationFilter(this)"
    >
      💳 未付款
    </button>

    <button
      class="filter-button"
      data-type="delivery"
      onclick="setNotificationFilter(this)"
    >
      📦 待交付
    </button>

    <button
      class="filter-button"
      data-type="deadline"
      onclick="setNotificationFilter(this)"
    >
      ⏰ 即將截止
    </button>

  </div>

</div>

<!-- 通知列表 -->

<div
  class="card-grid"
  id="notificationList"
>

  <div class="empty-box">

    🔔 通知資料載入中...

  </div>

</div>

</main>
  
 
  <script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbz7CVrbddXxIvd86Z3PeMyM9MT6q7QBe7EJ5n1uQU7pTkwCYgc-4gjcg7EmRmz5itDSJQ/exec';

let notificationsData = [];

let currentNotificationFilter =
  'all';

let currentNotificationSearch =
  '';

    // =========================
// 💳 讀取未付款提醒
// =========================

async function loadNotifications() {

  const list =
    document.getElementById(
      'notificationList'
    );


  try {

    list.innerHTML =
      `
        <div class="empty-box">
          🔔 正在整理通知...
        </div>
      `;


    // =========================
// 🧾 讀取訂單資料
// =========================

const orderResponse =
  await fetch(
    API_URL +
    '?action=getOrders'
  );


const orderResult =
  await orderResponse.json();


if (!orderResult.success) {

  throw new Error(
    orderResult.message ||
    '讀取訂單資料失敗'
  );

}


const orders =
  orderResult.data || [];


// =========================
// 🛍️ 讀取代購資料
// =========================

const groupBuyResponse =
  await fetch(
    API_URL +
    '?action=getGroupBuys'
  );


const groupBuyResult =
  await groupBuyResponse.json();


if (!groupBuyResult.success) {

  throw new Error(
    groupBuyResult.message ||
    '讀取代購資料失敗'
  );

}


const groupBuys =
  groupBuyResult.data || [];


// =========================
// 💳 未付款訂單
// =========================

const unpaidOrders =
  orders.filter(
    function(item) {

      return (
        item.paymentStatus ===
        '🔴 未付款'
      );

    }
  );


// =========================
// 📦 已到貨待交付
// =========================

const deliveryOrders =
  orders.filter(
    function(item) {

      return (
        item.orderStatus ===
        '🟡 已到貨'
      );

    }
  );


// =========================
// 🔔 建立通知資料
// =========================

const unpaidNotifications =
  unpaidOrders.map(
    function(item) {

      return {
        type:
          'unpaid',

        name:
          item.name || '',

        groupBuy:
          item.groupBuy || '',

        product:
          item.product || '',

        amount:
          item.total || 0
      };

    }
  );


const deliveryNotifications =
  deliveryOrders.map(
    function(item) {

      return {
        type:
          'delivery',

        name:
          item.name || '',

        groupBuy:
          item.groupBuy || '',

        product:
          item.product || '',

        amount:
          item.total || 0
      };

    }
  );


// =========================
// ⏰ 即將截止代購
// =========================

const today =
  new Date();

today.setHours(
  0,
  0,
  0,
  0
);


const deadlineLimit =
  new Date(today);

deadlineLimit.setDate(
  deadlineLimit.getDate() + 3
);


const deadlineNotifications =
  groupBuys
    .filter(
      function(item) {

        if (!item.deadline) {
          return false;
        }


        const deadline =
          new Date(
            item.deadline +
            'T00:00:00'
          );


        return (
          deadline >= today &&
          deadline <= deadlineLimit
        );

      }
    )
    .map(
      function(item) {

        return {
          type:
            'deadline',

          name:
            item.name || '',

          groupBuy:
            item.group || '',

          product:
            '',

          amount:
            0,

          deadline:
            item.deadline || ''
        };

      }
    );


// =========================
// 🔔 合併所有通知
// =========================

notificationsData = [
  ...unpaidNotifications,
  ...deliveryNotifications,
  ...deadlineNotifications
];

// =========================
// 🔔 更新通知統計
// =========================

document.getElementById(
  'unpaidNotificationCount'
).textContent =
  unpaidNotifications.length;


document.getElementById(
  'deliveryNotificationCount'
).textContent =
  deliveryNotifications.length;


document.getElementById(
  'deadlineNotificationCount'
).textContent =
  deadlineNotifications.length;


document.getElementById(
  'totalNotificationCount'
).textContent =
  notificationsData.length;


renderNotifications(
  notificationsData
);


  } catch (error) {

    console.error(
      error
    );


    list.innerHTML =
      `
        <div class="empty-box">
          ⚠️ 讀取通知失敗
          <br><br>
          ${error.message}
        </div>
      `;

  }

}

    // =========================
// 🔔 顯示通知卡片
// =========================

function renderNotifications(
  notifications
) {

  const list =
    document.getElementById(
      'notificationList'
    );


  if (
    notifications.length === 0
  ) {

    list.innerHTML =
      `
        <div class="empty-box">
          🎉 目前沒有需要處理的通知
        </div>
      `;

    return;

  }


  list.innerHTML =
    notifications
      .map(
        function(item) {

          let notificationTitle =
            '🔔 待處理提醒';


          if (
            item.type === 'unpaid'
          ) {

            notificationTitle =
              '💳 尚未付款';

          }


          if (
            item.type === 'delivery'
          ) {

            notificationTitle =
              '📦 已到貨待交付';

          }

          if (
  item.type === 'deadline'
) {

  notificationTitle =
    '⏰ 即將截止';

}
          

          return `
            <div class="trade-card">

              <div class="trade-body">

                <div class="trade-name">
                  ${notificationTitle}
                </div>

                <div class="trade-detail">
                  👤 ${item.name || '未填姓名'}
                </div>

                <div class="trade-detail">
                  🛍️ ${item.groupBuy || '未填代購'}
                </div>

                ${
                  item.product
                    ? `
                        <div class="trade-detail">
                          📦 ${item.product}
                        </div>
                      `
                    : ''
                }

                ${
  item.type === 'deadline'
    ? `
        <div class="trade-detail">
          📅 截止日期：${item.deadline || '未設定'}
        </div>
      `
    : `
        <div class="trade-detail">
          💰 NT$ ${Number(
            item.amount || 0
          ).toLocaleString()}
        </div>
      `
}

              </div>

            </div>
          `;

        }
      )
      .join('');

}
    
// =========================
// 🏷️ 通知類型篩選
// =========================

function setNotificationFilter(
  button
) {

  currentNotificationFilter =
    button.dataset.type;


  document
    .querySelectorAll(
      '.filter-button'
    )
    .forEach(
      function(item) {

        item.classList.remove(
          'active'
        );

      }
    );


  button.classList.add(
    'active'
  );


  applyNotificationFilters();

}


// =========================
// 🔍 搜尋與篩選通知
// =========================

function applyNotificationFilters() {

  const searchInput =
    document.getElementById(
      'notificationSearch'
    );


  currentNotificationSearch =
    searchInput.value
      .trim()
      .toLowerCase();


  const filteredNotifications =
    notificationsData.filter(
      function(item) {

        const matchesType =
          currentNotificationFilter ===
            'all' ||
          item.type ===
            currentNotificationFilter;


        const searchText =
          [
            item.name,
            item.groupBuy,
            item.product
          ]
            .filter(Boolean)
            .join(' ')
            .toLowerCase();


        const matchesSearch =
          !currentNotificationSearch ||
          searchText.includes(
            currentNotificationSearch
          );


        return (
          matchesType &&
          matchesSearch
        );

      }
    );


  renderNotifications(
    filteredNotifications
  );

}


// =========================
// 🔍 搜尋通知
// =========================

document
  .getElementById(
    'notificationSearch'
  )
  .addEventListener(
    'input',
    applyNotificationFilters
  );


// =========================
// 🔔 開啟頁面時自動讀取
// =========================

loadNotifications();
    
</script>
  
</body>

</html>
