<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FanFlow</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans TC", sans-serif;
      background: #f6f7fb;
      color: #222;
    }

    /* 左側選單 */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 230px;
      height: 100vh;
      background: white;
      border-right: 1px solid #e8e8e8;
      padding: 24px 16px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 35px;
      padding: 0 10px;
    }

    .logo span {
      color: #5c63ff;
    }

    .menu-item {
      padding: 13px 14px;
      margin-bottom: 6px;
      border-radius: 10px;
      cursor: pointer;
      color: #555;
      text-decoration: none;
display: block;
    }

    .menu-item.active {
      background: #eef0ff;
      color: #4d55e8;
      font-weight: 700;
    }

    .menu-item:hover {
      background: #f3f4f8;
    }

    /* 主畫面 */
    .main {
      margin-left: 230px;
      padding: 40px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      margin-top: 8px;
      color: #888;
    }

    /* 統計卡片 */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-top: 32px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .card-title {
      font-size: 14px;
      color: #777;
    }

    .card-number {
      font-size: 26px;
      font-weight: 800;
      margin-top: 10px;
    }

    /* 內容區 */
    .section {
      margin-top: 35px;
    }

    .section h2 {
      font-size: 20px;
      margin-bottom: 18px;
    }

    .empty-box {
      background: white;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      color: #aaa;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    /* Dashboard 進行中代購 */

.dashboard-groupbuy-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  text-align: left;
}

.dashboard-groupbuy-card {
  display: flex;
  align-items: center;
  gap: 16px;
  background: white;
  border: 1px solid #eeeeee;
  border-radius: 14px;
  padding: 14px;
}

.dashboard-groupbuy-image {
  width: 85px;
  height: 85px;
  flex-shrink: 0;
  border-radius: 12px;
  object-fit: cover;
  background: #f3f4f8;
}

.dashboard-groupbuy-placeholder {
  width: 85px;
  height: 85px;
  flex-shrink: 0;
  border-radius: 12px;
  background: #f3f4f8;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
}

.dashboard-groupbuy-info {
  min-width: 0;
}

.dashboard-groupbuy-name {
  font-size: 16px;
  font-weight: 700;
  color: #222;
  margin-bottom: 7px;
}

.dashboard-groupbuy-detail {
  font-size: 14px;
  color: #777;
  margin-top: 5px;
}

    /* =========================
   ⚡ 快速操作按鈕
========================= */

.quick-action-button {
  border: none;
  background: #5865f2;
  color: white;
  padding: 11px 18px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

.quick-action-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 12px rgba(0, 0, 0, 0.12);
}
    
    /* 手機 */
    @media (max-width: 800px) {

      .sidebar {
        width: 75px;
        padding: 20px 10px;
      }

      .logo {
        font-size: 18px;
        padding: 0;
        text-align: center;
      }

      .logo-text {
        display: none;
      }

      .menu-text {
        display: none;
      }

      .menu-item {
        text-align: center;
      }

      .main {
        margin-left: 75px;
        padding: 22px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
      .dashboard-groupbuy-list {
  grid-template-columns: 1fr;
}

.dashboard-groupbuy-image,
.dashboard-groupbuy-placeholder {
  width: 70px;
  height: 70px;
}
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="logo">
      💙 <span class="logo-text">Fan<span>Flow</span></span>
    </div>

    <div class="menu-item active">
      🏠 <span class="menu-text">首頁</span>
    </div>

<a href="groupbuy.html" class="menu-item">
  🛍️ <span class="menu-text">周邊代購</span>
</a>

    <a href="cardtrade.html" class="menu-item">
  🃏 <span class="menu-text">小卡交易</span>
</a>

    <a href="finance.html" class="menu-item">
  💰 <span class="menu-text">帳務中心</span>
</a>

    <a
  href="collection.html"class="menu-item">
  ♡<span class="menu-text">收藏庫</span>
</a>

   <a href="members.html" class="menu-item">
  👥 <span class="menu-text">成員管理</span>
</a>

    <a
  href="notifications.html"
  class="menu-item"
>
  🔔
  <span class="menu-text">
    通知中心
  </span>
</a>

    <a
  href="settings.html"
  class="menu-item"
>
  ⚙️
  <span class="menu-text">
    設定
  </span>
</a>

  </aside>


  <main class="main">

    <h1>嗨，Yu 👋</h1>
    <div class="subtitle">
      今天也是快樂追星的一天！
    </div>

    <div class="stats">

      <div
  class="card"
  onclick="window.location.href='finance.html'"
  style="cursor: pointer;"
>
  <div class="card-title">
    💳 未收款金額
  </div>

  <div
    class="card-number"
    id="unpaidAmount"
  >
    NT$ 0
  </div>
</div>

      <div
  class="card"
  onclick="window.location.href='groupbuy.html'"
  style="cursor: pointer;"
>
  <div class="card-title">
    📦 未到貨商品
  </div>

  <div
    class="card-number"
    id="unarrivedItemCount"
  >
    0 件
  </div>
</div>

      <div
  class="card"
  onclick="window.location.href='groupbuy.html'"
  style="cursor: pointer;"
>
  <div class="card-title">
    🔄 進行中代購
  </div>

  <div
    class="card-number"
    id="activeGroupBuyCount"
  >
    0 團
  </div>
</div>

      <div
  class="card"
  onclick="window.location.href='groupbuy.html'"
  style="cursor: pointer;"
>
  <div class="card-title">
    🟡 待交付商品
  </div>

  <div
    class="card-number"
    id="waitingDeliveryCount"
  >
    0 件
  </div>
</div>

    </div>

    <!-- =========================
     ⚡ 快速操作
========================= -->

<div class="section">

  <h2>⚡ 快速操作</h2>

  <div
    style="
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    "
  >

    <button
      type="button"
      class="quick-action-button"
      onclick="window.location.href='groupbuy.html?action=new'"
    >
      ＋ 建立代購
    </button>

    <button
      type="button"
      class="quick-action-button"
      onclick="window.location.href='cardtrade.html?action=new'"
    >
      ＋ 新增小卡交易
    </button>

    <button
      type="button"
      class="quick-action-button"
      onclick="window.location.href='collection.html'"
    >
      ＋ 新增收藏
    </button>

  </div>

</div>
    
<!-- =========================
     🔔 今日待處理
========================= -->

<div class="section">

  <h2>
  🔔 待處理事項
  <span
    id="dashboardNotificationCount"
    style="
      font-size: 14px;
      font-weight: 500;
      color: #888;
      margin-left: 8px;
    "
  >
    共 0 項
  </span>
</h2>

  <div
    class="empty-box"
    id="dashboardNotificationList"
  >
    正在讀取待處理事項...
  </div>

</div>
    
    <div class="section">

      <h2>進行中的代購</h2>

      <div
  class="empty-box"
  id="activeGroupBuyList"
>
  正在讀取進行中的代購...
</div>

    </div>

  </main>

  <script>

  const API_URL =
    'https://script.google.com/macros/s/AKfycbz7CVrbddXxIvd86Z3PeMyM9MT6q7QBe7EJ5n1uQU7pTkwCYgc-4gjcg7EmRmz5itDSJQ/exec';

    // =========================
// 🛍️ 讀取代購 Dashboard
// =========================

async function loadDashboardGroupBuys() {

  try {

    const response =
      await fetch(
        API_URL + '?action=getGroupBuys'
      );

    const result =
      await response.json();


    if (!result.success) {
      throw new Error(
        result.message ||
        '讀取代購失敗'
      );
    }


    const groupBuys =
      result.data || [];


    const activeGroupBuys =
      groupBuys.filter(
        function(item) {

          return (
            item.status ===
            '🟢 進行中'
          );

        }
      );


    document.getElementById(
      'activeGroupBuyCount'
    ).textContent =
      activeGroupBuys.length +
      ' 團';

    // =========================
// 💳 計算未收款金額
// =========================

let unpaidAmount = 0;
let unarrivedItemCount = 0;
let waitingDeliveryCount = 0;

let dashboardNotifications = [];

// =========================
// ⏰ 即將截止提醒
// =========================

const today =
  new Date();

today.setHours(
  0,
  0,
  0,
  0
);


const savedDeadlineDays =
  localStorage.getItem(
    'fanflowDeadlineReminderDays'
  );

const reminderDays =
  Number(
    savedDeadlineDays || 3
  );


const deadlineLimit =
  new Date(today);

deadlineLimit.setDate(
  deadlineLimit.getDate() +
  reminderDays
);


activeGroupBuys.forEach(
  function(groupBuy) {

    if (!groupBuy.deadline) {
      return;
    }


    const deadline =
      new Date(
        groupBuy.deadline +
        'T00:00:00'
      );


    if (
      deadline >= today &&
      deadline <= deadlineLimit
    ) {

      dashboardNotifications.push({
        type: 'deadline',
        name: groupBuy.name || '',
        groupBuy: groupBuy.group || '',
        deadline: groupBuy.deadline || ''
      });

    }

  }
);
  
for (const groupBuy of activeGroupBuys) {

  const orderResponse =
    await fetch(
      API_URL +
      '?action=getOrders&groupBuyName=' +
      encodeURIComponent(groupBuy.name)
    );


  const orderResult =
    await orderResponse.json();


  if (!orderResult.success) {
    continue;
  }


  const orders =
    orderResult.data || [];


  orders.forEach(function(order) {

  // 💳 未收款
if (
  order.paymentStatus ===
  '🔴 未付款'
) {

  unpaidAmount +=
    Number(order.total) || 0;


  dashboardNotifications.push({
    type: 'unpaid',
    name: order.name || '',
    groupBuy: groupBuy.name || '',
    product: order.product || '',
    amount: Number(order.total) || 0
  });

}


  // 📦 未到貨商品
  if (
    order.orderStatus ===
    '⚪ 未到貨'
  ) {

    unarrivedItemCount +=
      Number(order.quantity) || 0;

  }

    // 🟡 已到貨、等待交付
if (
  order.orderStatus ===
  '🟡 已到貨'
) {

  waitingDeliveryCount +=
    Number(order.quantity) || 0;


  dashboardNotifications.push({
    type: 'delivery',
    name: order.name || '',
    groupBuy: groupBuy.name || '',
    product: order.product || '',
    quantity: Number(order.quantity) || 0
  });

}
    
});

}


document.getElementById(
  'unpaidAmount'
).textContent =
  'NT$ ' +
  unpaidAmount.toLocaleString();

    document.getElementById(
  'unarrivedItemCount'
).textContent =
  unarrivedItemCount.toLocaleString() +
  ' 件';

    document.getElementById(
  'waitingDeliveryCount'
).textContent =
  waitingDeliveryCount.toLocaleString() +
  ' 件';

    // =========================
// 🔔 今日待處理
// =========================

const dashboardNotificationList =
  document.getElementById(
    'dashboardNotificationList'
  );

    const dashboardNotificationCount =
  document.getElementById(
    'dashboardNotificationCount'
  );


dashboardNotificationCount.textContent =
  '共 ' +
  dashboardNotifications.length +
  ' 項';

if (dashboardNotifications.length === 0) {

  dashboardNotificationList.innerHTML =
    '今天沒有需要處理的事項 ✨';

} else {

  dashboardNotificationList.innerHTML =
    `
      <div class="dashboard-groupbuy-list">

        ${
  dashboardNotifications
    .slice()
    .sort(function(a, b) {

      // ⏰ 兩筆都是截止提醒
      if (
        a.type === 'deadline' &&
        b.type === 'deadline'
      ) {

        return (
          new Date(
            a.deadline + 'T00:00:00'
          ) -
          new Date(
            b.deadline + 'T00:00:00'
          )
        );

      }


      // ⏰ 截止提醒優先
      if (a.type === 'deadline') {
        return -1;
      }

      if (b.type === 'deadline') {
        return 1;
      }


      // 💳 未付款排第二
      if (
        a.type === 'unpaid' &&
        b.type !== 'unpaid'
      ) {
        return -1;
      }

      if (
        b.type === 'unpaid' &&
        a.type !== 'unpaid'
      ) {
        return 1;
      }


      // 📦 其他維持原本順序
      return 0;

    })
    .map(function(item) {

              let title = '';
              let detail = '';
              let targetPage = 'notifications.html';


              if (item.type === 'unpaid') {

                title =
                  '💳 尚未付款';

                detail =
                  `
                    👤 ${item.name || '未設定'}
                    ｜📦 ${item.product || '未設定'}
                    ｜💰 NT$ ${Number(
                      item.amount || 0
                    ).toLocaleString()}
                  `;

                targetPage =
                  'finance.html';

              }


              if (item.type === 'delivery') {

                title =
                  '📦 已到貨待交付';

                detail =
                  `
                    👤 ${item.name || '未設定'}
                    ｜📦 ${item.product || '未設定'}
                    ｜🔢 ${Number(
                      item.quantity || 0
                    ).toLocaleString()} 件
                  `;

                targetPage =
                  'groupbuy.html';

              }


             if (item.type === 'deadline') {

  title =
    '⏰ 即將截止';


  const deadlineDate =
    new Date(
      item.deadline +
      'T00:00:00'
    );


  const daysLeft =
    Math.ceil(
      (
        deadlineDate.getTime() -
        today.getTime()
      ) /
      (
        1000 *
        60 *
        60 *
        24
      )
    );


  let deadlineText = '';

  if (daysLeft === 0) {

    deadlineText =
      '🔥 今天截止';

  } else {

    deadlineText =
      '剩 ' +
      daysLeft +
      ' 天';

  }


  detail =
    `
      🛍️ ${item.name || '未設定'}
      ｜📅 ${item.deadline || '未設定'}
      ｜${deadlineText}
    `;


  targetPage =
    'groupbuy.html';

}


              return `
                <div
                  class="dashboard-groupbuy-card"
                  onclick="window.location.href='${targetPage}'"
                  style="cursor: pointer;"
                >

                  <div
                    class="dashboard-groupbuy-placeholder"
                  >
                    ${
                      item.type === 'unpaid'
                        ? '💳'
                        : item.type === 'delivery'
                          ? '📦'
                          : '⏰'
                    }
                  </div>

                  <div class="dashboard-groupbuy-info">

                    <div class="dashboard-groupbuy-name">
                      ${title}
                    </div>

                    <div class="dashboard-groupbuy-detail">
                      ${detail}
                    </div>

                    ${
                      item.groupBuy
                        ? `
                          <div class="dashboard-groupbuy-detail">
                            🛍️ ${item.groupBuy}
                          </div>
                        `
                        : ''
                    }

                  </div>

                </div>
              `;

            })
            .join('')
        }

      </div>
    `;

}
    
    const activeGroupBuyList =
  document.getElementById(
    'activeGroupBuyList'
  );


if (activeGroupBuys.length === 0) {

  activeGroupBuyList.innerHTML =
    '目前沒有進行中的代購 ✨';

} else {

  activeGroupBuyList.innerHTML =
    `
      <div class="dashboard-groupbuy-list">

        ${
          activeGroupBuys
            .map(function(item) {

              const imageHtml =
                item.imageUrl
                  ? `
                    <img
                      class="dashboard-groupbuy-image"
                      src="${item.imageUrl}"
                      alt=""
                    >
                  `
                  : `
                    <div
                      class="dashboard-groupbuy-placeholder"
                    >
                      📦
                    </div>
                  `;


              return `
                <div
  class="dashboard-groupbuy-card"
  onclick="window.location.href='groupbuy.html'"
  style="cursor: pointer;"
>
                  ${imageHtml}

                  <div class="dashboard-groupbuy-info">

                    <div class="dashboard-groupbuy-name">
                      🛍️ ${item.name || ''}
                    </div>

                    <div class="dashboard-groupbuy-detail">
                      🎤 ${item.group || '未設定'}
                    </div>

                    <div class="dashboard-groupbuy-detail">
                      📅 截止：${item.deadline || '未設定'}
                    </div>

                  </div>

                </div>
              `;

            })
            .join('')
        }

      </div>
    `;

}
    

  } catch (error) {

    console.error(
      '讀取 Dashboard 失敗：',
      error
    );

  }

}


loadDashboardGroupBuys();
    
</script>
  
</body>
</html>
