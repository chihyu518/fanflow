<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FanFlow</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans TC", sans-serif;
      background: #f6f7fb;
      color: #222;
    }

    /* 左側選單 */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 230px;
      height: 100vh;
      background: white;
      border-right: 1px solid #e8e8e8;
      padding: 24px 16px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 35px;
      padding: 0 10px;
    }

    .logo span {
      color: #5c63ff;
    }

    .menu-item {
      padding: 13px 14px;
      margin-bottom: 6px;
      border-radius: 10px;
      cursor: pointer;
      color: #555;
      text-decoration: none;
display: block;
    }

    .menu-item.active {
      background: #eef0ff;
      color: #4d55e8;
      font-weight: 700;
    }

    .menu-item:hover {
      background: #f3f4f8;
    }

    /* 主畫面 */
    .main {
      margin-left: 230px;
      padding: 40px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      margin-top: 8px;
      color: #888;
    }

    /* 統計卡片 */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-top: 32px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .card-title {
      font-size: 14px;
      color: #777;
    }

    .card-number {
      font-size: 26px;
      font-weight: 800;
      margin-top: 10px;
    }

    /* 內容區 */
    .section {
      margin-top: 35px;
    }

    .section h2 {
      font-size: 20px;
      margin-bottom: 18px;
    }

    .empty-box {
      background: white;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      color: #aaa;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    /* 手機 */
    @media (max-width: 800px) {

      .sidebar {
        width: 75px;
        padding: 20px 10px;
      }

      .logo {
        font-size: 18px;
        padding: 0;
        text-align: center;
      }

      .logo-text {
        display: none;
      }

      .menu-text {
        display: none;
      }

      .menu-item {
        text-align: center;
      }

      .main {
        margin-left: 75px;
        padding: 22px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="logo">
      💙 <span class="logo-text">Fan<span>Flow</span></span>
    </div>

    <div class="menu-item active">
      🏠 <span class="menu-text">首頁</span>
    </div>

<a href="groupbuy.html" class="menu-item">
  🛍️ <span class="menu-text">周邊代購</span>
</a>

    <div class="menu-item">
      🃏 <span class="menu-text">小卡交易</span>
    </div>

    <div class="menu-item">
      💰 <span class="menu-text">帳務中心</span>
    </div>

    <div class="menu-item">
      ♡ <span class="menu-text">收藏庫</span>
    </div>

    <div class="menu-item">
      👥 <span class="menu-text">成員管理</span>
    </div>

    <div class="menu-item">
      🔔 <span class="menu-text">通知中心</span>
    </div>

    <div class="menu-item">
      ⚙️ <span class="menu-text">設定</span>
    </div>

  </aside>


  <main class="main">

    <h1>嗨，Yu 👋</h1>
    <div class="subtitle">
      今天也是快樂追星的一天！
    </div>

    <div class="stats">

      <div class="card">
        <div class="card-title">💳 待付款金額</div>
        <div class="card-number">NT$ 0</div>
      </div>

      <div class="card">
        <div class="card-title">📦 待領取商品</div>
        <div class="card-number">0 件</div>
      </div>

      <div class="card">
        <div class="card-title">🔄 進行中代購</div>
        <div class="card-number">0 團</div>
      </div>

      <div class="card">
        <div class="card-title">♡ 我的收藏</div>
        <div class="card-number">0 張</div>
      </div>

    </div>


    <div class="section">

      <h2>進行中的代購</h2>

      <div class="empty-box">
        目前沒有進行中的代購 ✨
      </div>

    </div>

  </main>

</body>
</html>
