<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FanFlow｜收藏庫</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      background: #f6f7fb;
      color: #222;
    }

    /* =========================
       左側選單
    ========================= */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 230px;
      background: white;
      border-right: 1px solid #eeeeee;
      padding: 24px 16px;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 30px;
      padding-left: 12px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      margin-bottom: 6px;
      border-radius: 12px;
      color: #555;
      text-decoration: none;
      font-size: 15px;
    }

    .menu-item:hover {
      background: #f5f6fa;
    }

    .menu-item.active {
      background: #eef1ff;
      color: #4056d6;
      font-weight: 700;
    }


    /* =========================
       主畫面
    ========================= */

    .main {
      margin-left: 230px;
      padding: 35px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .page-title {
      margin: 0;
      font-size: 28px;
    }

    .page-subtitle {
      margin-top: 7px;
      color: #888;
      font-size: 14px;
    }

    .add-button {
      border: none;
      background: #4056d6;
      color: white;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }


    /* =========================
       統計卡
    ========================= */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #eeeeee;
    }

    .stat-label {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 25px;
      font-weight: 800;
    }


    /* =========================
       搜尋／篩選
    ========================= */

    .toolbar {
      background: white;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-button {
      border: 1px solid #dddddd;
      background: white;
      padding: 8px 13px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    .filter-button.active {
      background: #4056d6;
      border-color: #4056d6;
      color: white;
    }


    /* =========================
       小卡區
    ========================= */

    .card-grid {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 18px;
    }

    .trade-card {
      background: white;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      overflow: hidden;
    }

    .trade-image {
      width: 100%;
      height: 230px;
      object-fit: cover;
      background: #f1f2f6;
    }

    .trade-placeholder {
      height: 230px;
      background: #f1f2f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .trade-body {
      padding: 16px;
    }

    .trade-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .trade-detail {
      color: #666;
      font-size: 14px;
      margin-top: 6px;
    }

    .empty-box {
      grid-column: 1 / -1;
      background: white;
      border: 1px dashed #d8d8d8;
      border-radius: 16px;
      padding: 60px 20px;
      text-align: center;
      color: #888;
    }


    /* =========================
       手機版
    ========================= */

    @media (max-width: 800px) {

      .sidebar {
        width: 75px;
        padding:
          24px 10px;
      }

      .logo {
        font-size: 0;
        padding-left: 10px;
      }

      .logo::after {
        content: "F";
        font-size: 24px;
      }

      .menu-text {
        display: none;
      }

      .menu-item {
        justify-content: center;
        font-size: 20px;
      }

      .main {
        margin-left: 75px;
        padding: 20px;
      }

      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .card-grid {
        grid-template-columns: 1fr;
      }

    }

    /* =========================
   🃏 小卡新增／編輯視窗
========================= */

.modal-overlay {

}

}

.modal-box {

}

.modal-header {

}

.modal-close {

  background: #f3f4f8;
  font-size: 24px;
  cursor: pointer;
  line-height: 1;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  margin-bottom: 7px;
  font-size: 14px;
  font-weight: 700;
  color: #444;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  border: 1px solid #dddddd;
  border-radius: 10px;
  padding: 11px 12px;
  font-size: 15px;
  font-family: inherit;
  background: white;
  outline: none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: #4056d6;
}

.form-group textarea {
  resize: vertical;
}

.form-row {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 24px;
}

.cancel-button,
.save-button {
  border: none;
  border-radius: 10px;
  padding: 11px 18px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;

.cancel-button {

.save-button {

}

@media (max-width: 600px) {

    grid-template-columns: 1fr;

}

  padding: 4px 6px;

}

.status-clickable:hover {

  <script>

  const API_URL =
    'https://script.google.com/macros/s/AKfycbz7CVrbddXxIvd86Z3PeMyM9MT6q7QBe7EJ5n1uQU7pTkwCYgc-4gjcg7EmRmz5itDSJQ/exec';

    // =========================
// 🔐 FanFlow 登入保護
// =========================

const fanflowSessionToken =
  sessionStorage.getItem(
    'fanflowSessionToken'
  );


if (!fanflowSessionToken) {

  window.location.replace(
    'login.html'
  );

} else {

  verifyFanFlowSession();

}


async function verifyFanFlowSession() {

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: 'POST',

          body:
            JSON.stringify({
              action:
                'verifyFanFlowSession',

              token:
                fanflowSessionToken
            })
        }
      );


    const result =
      await response.json();


    if (!result.success) {

      sessionStorage.removeItem(
        'fanflowSessionToken'
      );

      sessionStorage.removeItem(
        'fanflowUser'
      );

      window.location.replace(
        'login.html'
      );

      return;

    }


    sessionStorage.setItem(
      'fanflowUser',
      JSON.stringify(
        result.user
      )
    );


  } catch (error) {

    console.error(
      'Session 驗證失敗：',
      error
    );

    sessionStorage.removeItem(
      'fanflowSessionToken'
    );

    sessionStorage.removeItem(
      'fanflowUser'
    );

    window.location.replace(
      'login.html'
    );

  }

}

    let collectionsData = [];
    let membersData = [];

    const fanflowUser =
  JSON.parse(
    sessionStorage.getItem(

let editingCollectionId = '';
let currentCollectionFilter = 'all';
let currentCollectionSearch = '';

}

    // =========================
// ⚡ 首頁快速新增收藏

const collectionUrlParams =

if (

    // =========================
// ✏️ 編輯收藏
// =========================

function editCollection(id) {

  const item =
    collectionsData.find(
      function(collection) {
        return collection.id === id;
      }
    );


  if (!item) {

    alert(
      '找不到這筆收藏資料'
    );

    return;

  }


  editingCollectionId =
    item.id;


  document.getElementById(
    'collectionModalTitle'
  ).textContent =
    '✏️ 編輯收藏';


  document.getElementById(
    'collectionName'
  ).value =
    item.name || '';


  document.getElementById(
    'collectionType'
  ).value =
    item.type || '🃏 小卡';


  document.getElementById(
    'collectionGroup'
  ).value =
    item.group || '';


  document.getElementById(
    'collectionMember'
  ).value =
    item.member || '';


  document.getElementById(
    'collectionVersion'
  ).value =
    item.version || '';


  document.getElementById(
    'collectionQuantity'
  ).value =
    item.quantity || 1;


  document.getElementById(
    'collectionPrice'
  ).value =
    item.price || '';


  document.getElementById(
    'collectionDate'
  ).value =
    item.acquiredDate || '';


  document.getElementById(
    'collectionImage'
  ).value = '';


  document.getElementById(
    'collectionNote'
  ).value =
    item.note || '';


  document.getElementById(
    'collectionModal'
  ).classList.add('show');

}

    // =========================
// 🗑️ 刪除收藏
// =========================

async function deleteCollectionItem(
  id,
  name
) {

  const confirmed =
    confirm(
      `確定要刪除「${name}」嗎？\n\n刪除後會移到 Notion 垃圾桶。`
    );

  if (!confirmed) {
    return;
  }


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: 'POST',

          body:
            JSON.stringify({
              action:
                'deleteCollection',

              id:
                id
            })
        }
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        '刪除收藏失敗'
      );

    }


    alert(
      '刪除收藏成功！🗑️'
    );


    await loadCollections();


  } catch (error) {

    console.error(error);

    alert(
      '刪除失敗：' +
      error.message
    );

  }

}

    function compressImage(file) {

      return new Promise(
        (
          resolve,
          reject
        ) => {

          const reader =
            new FileReader();


          reader.onload =
            function(event) {

              const img =
                new Image();


              img.onload =
                function() {

                  const maxWidth =
                    1200;

                  const maxHeight =
                    1200;


                  let width =
                    img.width;

                  let height =
                    img.height;


                  if (
                    width > maxWidth ||
                    height > maxHeight
                  ) {

                    const ratio =
                      Math.min(
                        maxWidth / width,
                        maxHeight / height
                      );


                    width =
                      Math.round(
                        width * ratio
                      );


                    height =
                      Math.round(
                        height * ratio
                      );

                  }


                  const canvas =
                    document.createElement(
                      'canvas'
                    );


                  canvas.width =
                    width;

                  canvas.height =
                    height;


                  const ctx =
                    canvas.getContext(
                      '2d'
                    );


                  ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                  );


                  const compressedData =
                    canvas.toDataURL(
                      'image/jpeg',
                      0.8
                    );


                  resolve(
                    compressedData
                  );

                };


              img.onerror =
                function() {

                  reject(
                    new Error(
                      '圖片處理失敗'
                    )
                  );

                };


              img.src =
                event.target.result;

            };


          reader.onerror =
            function() {

              reject(
                new Error(
                  '圖片讀取失敗'
                )
              );

            };


          reader.readAsDataURL(
            file
          );

        }
      );

    }

async function saveCollection() {

  const name =
    document.getElementById(
      'collectionName'
    ).value.trim();

  if (!name) {
    alert('請輸入收藏名稱');
    return;
  }


  const saveButton =
    document.getElementById(
      'saveCollectionButton'
    );

  saveButton.disabled = true;
  saveButton.textContent =
    '儲存中...';


  // 判斷現在是新增還是編輯
  const isEditing =
    Boolean(editingCollectionId);


  try {

    // =========================
    // 📸 處理收藏圖片
    // =========================

    const imageInput =
      document.getElementById(
        'collectionImage'
      );

    const imageFile =
      imageInput.files[0];

    let imageData = '';
    let imageName = '';
    let imageType = '';

    // 編輯時先取得原本圖片
    let existingImageUrl = '';

    if (isEditing) {

      const existingItem =
        collectionsData.find(
          function(collection) {
            return collection.id ===
              editingCollectionId;
          }
        );

      if (existingItem) {
        existingImageUrl =
          existingItem.imageUrl || '';
      }

    }


    // 如果有重新選圖片
    if (imageFile) {

      imageData =
        await compressImage(
          imageFile
        );

      imageName =
        'collection-' +
        Date.now() +
        '.jpg';

      imageType =
        'image/jpeg';

    }


    const data = {

      action:
        isEditing
          ? 'updateCollection'
          : 'createCollection',

      token:
  fanflowSessionToken,
      
      id:
        editingCollectionId,

      name:
        name,

      type:
        document.getElementById(
          'collectionType'
        ).value,

      group:
        document.getElementById(
          'collectionGroup'
        ).value.trim(),

      member:
        document.getElementById(
          'collectionMember'
        ).value.trim(),

      version:
        document.getElementById(
          'collectionVersion'
        ).value.trim(),

      quantity:
        Number(
          document.getElementById(
            'collectionQuantity'
          ).value
        ) || 1,

      price:
        Number(
          document.getElementById(
            'collectionPrice'
          ).value
        ) || 0,

      acquiredDate:
        document.getElementById(
          'collectionDate'
        ).value,

      note:
        document.getElementById(
          'collectionNote'
        ).value.trim(),

      // 編輯時如果沒有換圖，
      // 後端會繼續使用原本圖片
      imageUrl:
        existingImageUrl,

      imageData:
        imageData,

      imageName:
        imageName,

      imageType:
        imageType

    };


    const response =
      await fetch(
        API_URL,
        {
          method: 'POST',

          body:
            JSON.stringify(data)
        }
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        (
          isEditing
            ? '修改收藏失敗'
            : '新增收藏失敗'
        )
      );

    }


    if (isEditing) {

      alert(
        '修改收藏成功！💖'
      );

    } else {

      alert(
        '新增收藏成功！💖'
      );

    }


    closeCollectionModal();


    // 清除編輯狀態
    editingCollectionId = '';


    // 清空表單
    document.getElementById(
      'collectionName'
    ).value = '';

    document.getElementById(
      'collectionType'
    ).value =
      '🃏 小卡';

    document.getElementById(
      'collectionGroup'
    ).value = '';

    document.getElementById(
      'collectionMember'
    ).value = '';

    document.getElementById(
      'collectionVersion'
    ).value = '';

    document.getElementById(
      'collectionQuantity'
    ).value = 1;

    document.getElementById(
      'collectionPrice'
    ).value = '';

    document.getElementById(
      'collectionDate'
    ).value = '';

    document.getElementById(
      'collectionImage'
    ).value = '';

    document.getElementById(
      'collectionNote'
    ).value = '';


    // 重新讀取收藏
    await loadCollections();


  } catch (error) {

    console.error(error);

    alert(
      (
        isEditing
          ? '修改失敗：'
          : '新增失敗：'
      ) +
      error.message
    );


  } finally {

    saveButton.disabled = false;
    saveButton.textContent =
      '儲存';

  }

}

<div class="trade-actions">

async function loadCollections() {

  const list =
    document.getElementById(
      'collectionList'
    );

  try {

    list.innerHTML =
      `
        <div class="empty-box">
          正在讀取收藏庫...
        </div>
      `;


    const response =
  await fetch(
    API_URL +
    '?action=getCollections&token=' +
    encodeURIComponent(
      fanflowSessionToken
    )
  );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        '讀取收藏庫失敗'
      );

    }


    const collections =
      result.data || [];

    collectionsData =
      collections;


    // =========================
    // 更新統計
    // =========================

    document.getElementById(
      'totalCollectionCount'
    ).textContent =
      collections.reduce(
        function(total, item) {
          return (
            total +
            (Number(item.quantity) || 0)
          );
        },
        0
      );


    document.getElementById(
      'cardCollectionCount'
    ).textContent =
      collections
        .filter(
          function(item) {
            return (
              item.type ===
              '🃏 小卡'
            );
          }
        )
        .reduce(
          function(total, item) {
            return (
              total +
              (Number(item.quantity) || 0)
            );
          },
          0
        );


    document.getElementById(
      'albumCollectionCount'
    ).textContent =
      collections
        .filter(
          function(item) {
            return (
              item.type ===
              '💿 專輯'
            );
          }
        )
        .reduce(
          function(total, item) {
            return (
              total +
              (Number(item.quantity) || 0)
            );
          },
          0
        );


    document.getElementById(
      'merchCollectionCount'
    ).textContent =
      collections
        .filter(
          function(item) {
            return (
              item.type ===
              '🎁 周邊'
            );
          }
        )
        .reduce(
          function(total, item) {
            return (
              total +
              (Number(item.quantity) || 0)
            );
          },
          0
        );


    // =========================
    // 沒有資料
    // =========================

    if (
      collections.length === 0
    ) {

      list.innerHTML =
        `
          <div class="empty-box">

            ♡ 目前還沒有收藏資料

            <br><br>

            點右上角「＋ 新增收藏」開始建立

          </div>
        `;

      return;

    }


    // =========================
    // 顯示收藏
    // =========================

    renderCollections(
      collections
    );


  } catch (error) {

    console.error(error);

    list.innerHTML =
      `
        <div class="empty-box">
          ⚠️ 讀取收藏庫失敗
          <br><br>
          ${error.message}
        </div>
      `;

  }

}

async function loadCollectionMembers() {

  const select =
    document.getElementById(
      'collectionMember'
    );

  if (!select) {
    return;
  }

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: 'POST',

          body:
            JSON.stringify({
              action:
                'getMembers',

              token:
                fanflowSessionToken
            })
        }
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        '讀取成員資料失敗'
      );

    }


    const members =
      result.data || [];

    membersData =
      members;


    console.log(
      '收藏庫收到成員:',
      members
    );


    // 清空下拉選單
    select.innerHTML = '';


    // =========================
    // 👑 管理員
    // 可以選擇所有成員
    // =========================

    if (
      fanflowUser.role ===
      '👑 管理員'
    ) {

      const placeholder =
        document.createElement(
          'option'
        );

      placeholder.value = '';

      placeholder.textContent =
        '請選擇成員';

      select.appendChild(
        placeholder
      );


      members.forEach(
        function(member) {

          const option =
            document.createElement(
              'option'
            );

          option.value =
            member.id;

          option.textContent =
            member.name ||
            '未命名成員';

          select.appendChild(
            option
          );

        }
      );

      return;

    }


    // =========================
    // 👤 一般成員
    // 自動選擇自己
    // =========================

    const myMember =
      members.find(
        function(member) {

          return (
            String(member.name).trim() ===
            String(fanflowUser.name).trim()
          );

        }
      );


    if (myMember) {

      const option =
        document.createElement(
          'option'
        );

      option.value =
        myMember.id;

      option.textContent =
        myMember.name ||
        '未命名成員';

      select.appendChild(
        option
      );

      select.value =
        myMember.id;

      select.disabled =
        true;

    } else {

      const option =
        document.createElement(
          'option'
        );

      option.value = '';

      option.textContent =
        '找不到目前登入者的成員資料';

      select.appendChild(
        option
      );

      select.disabled =
        true;

    }


  } catch (error) {

    console.error(
      '收藏庫載入成員失敗:',
      error
    );

    select.innerHTML =
      '<option value="">成員資料載入失敗</option>';

  }

}

function applyCollectionFilters() {

  const searchInput =
    document.getElementById(
      'collectionSearch'
    );

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();

  currentCollectionSearch =
    keyword;


  const filteredCollections =
    collectionsData.filter(
      function(item) {

        // 收藏類型
        const typeMatched =
          currentCollectionFilter === 'all' ||
          item.type ===
            currentCollectionFilter;


        // 搜尋文字
        const searchText = [
          item.name,
          item.group,
          item.member,
          item.version,
          item.note,
          item.type
        ]
          .join(' ')
          .toLowerCase();


        const keywordMatched =
          !keyword ||
          searchText.includes(
            keyword
          );


        return (
          typeMatched &&
          keywordMatched
        );

      }
    );


  renderCollections(
    filteredCollections
  );

}

function setCollectionFilter(
  button
) {

  currentCollectionFilter =
    button.dataset.type;


  document
    .querySelectorAll(
      '.filter-button'
    )
    .forEach(
      function(item) {

        item.classList.remove(
          'active'
        );

      }
    );


  button.classList.add(
    'active'
  );


  applyCollectionFilters();

}
