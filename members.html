<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

    name="viewport"

  >

  <title>FanFlow｜成員管理</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      background: #f6f7fb;
      color: #222;
    }

    /* =========================
       左側選單
    ========================= */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 230px;
      background: white;
      border-right: 1px solid #eeeeee;
      padding: 24px 16px;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 30px;
      padding-left: 12px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      margin-bottom: 6px;
      border-radius: 12px;
      color: #555;
      text-decoration: none;
      font-size: 15px;
    }

    .menu-item:hover {
      background: #f5f6fa;
    }

    .menu-item.active {
      background: #eef1ff;
      color: #4056d6;
      font-weight: 700;
    }


    /* =========================
       主畫面
    ========================= */

    .main {
      margin-left: 230px;
      padding: 35px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .page-title {
      margin: 0;
      font-size: 28px;
    }

    .page-subtitle {
      margin-top: 7px;
      color: #888;
      font-size: 14px;
    }

    .add-button {
      border: none;
      background: #4056d6;
      color: white;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }


    /* =========================
       統計卡
    ========================= */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #eeeeee;
    }

    .stat-label {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 25px;
      font-weight: 800;
    }


    /* =========================
       搜尋／篩選
    ========================= */

    .toolbar {
      background: white;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-button {
      border: 1px solid #dddddd;
      background: white;
      padding: 8px 13px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    .filter-button.active {
      background: #4056d6;
      border-color: #4056d6;
      color: white;
    }


    /* =========================
       小卡區
    ========================= */

    .card-grid {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 18px;
    }

    .trade-card {
      background: white;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      overflow: hidden;
    }

    .trade-image {
      width: 100%;
      height: 230px;
      object-fit: cover;
      background: #f1f2f6;
    }

    .trade-placeholder {
      height: 230px;
      background: #f1f2f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .trade-body {
      padding: 16px;
    }

    .trade-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .trade-detail {
      color: #666;
      font-size: 14px;
      margin-top: 6px;
    }

    .empty-box {
      grid-column: 1 / -1;
      background: white;
      border: 1px dashed #d8d8d8;
      border-radius: 16px;
      padding: 60px 20px;
      text-align: center;
      color: #888;
    }


    /* =========================
       手機版
    ========================= */

    @media (max-width: 800px) {

      .sidebar {
        width: 75px;
        padding:
          24px 10px;
      }

      .logo {
        font-size: 0;
        padding-left: 10px;
      }

      .logo::after {
        content: "F";
        font-size: 24px;
      }

      .menu-text {
        display: none;
      }

      .menu-item {
        justify-content: center;
        font-size: 20px;
      }

      .main {
        margin-left: 75px;
        padding: 20px;
      }

      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .card-grid {
        grid-template-columns: 1fr;
      }

    }

    /* =========================
   🃏 小卡新增／編輯視窗
========================= */

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.38);
  z-index: 1000;
  padding: 30px 20px;
  overflow-y: auto;
}

.modal-overlay.show {
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.modal-box {
  width: 100%;
  max-width: 620px;
  background: white;
  border-radius: 18px;
  padding: 24px;
  margin: auto;
  box-shadow:
    0 18px 50px
    rgba(0, 0, 0, 0.18);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 22px;
}

.modal-header h2 {
  margin: 0;
  font-size: 22px;
}

.modal-close {
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 10px;
  background: #f3f4f8;
  font-size: 24px;
  cursor: pointer;
  line-height: 1;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  margin-bottom: 7px;
  font-size: 14px;
  font-weight: 700;
  color: #444;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  border: 1px solid #dddddd;
  border-radius: 10px;
  padding: 11px 12px;
  font-size: 15px;
  font-family: inherit;
  background: white;
  outline: none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: #4056d6;
}

.form-group textarea {
  resize: vertical;
}

.form-row {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 24px;
}

.cancel-button,
.save-button {
  border: none;
  border-radius: 10px;
  padding: 11px 18px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.cancel-button {
  background: #f0f1f5;
  color: #555;
}

.save-button {
  background: #4056d6;
  color: white;
}

@media (max-width: 600px) {

  .modal-overlay {
    padding: 15px;
  }

  .modal-box {
    padding: 20px;
  }

  .form-row {
    grid-template-columns: 1fr;
    gap: 0;
  }

}

    /* =========================
   ✏️ 小卡操作按鈕
========================= */

.trade-actions {

.edit-trade-button {

    /* =========================

.status-clickable {

  padding: 4px 6px;
  margin-left: -6px;
  transition: 0.2s;
}

.status-clickable:hover {
  background: #f1f3f9;
}

  <script>

 const API_URL =
  'https://script.google.com/macros/s/AKfycbz7CVrbddXxIvd86Z3PeMyM9MT6q7QBe7EJ5n1uQU7pTkwCYgc-4gjcg7EmRmz5itDSJQ/exec';

    // =========================
// 🔐 FanFlow 登入保護
// =========================

const fanflowSessionToken =
  sessionStorage.getItem(
    'fanflowSessionToken'
  );


if (!fanflowSessionToken) {

  window.location.replace(
    'login.html'
  );

} else {

  verifyFanFlowSession();

}


async function verifyFanFlowSession() {

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: 'POST',

          body:
            JSON.stringify({
              action:
                'verifyFanFlowAdmin',

              token:
                fanflowSessionToken
            })
        }
      );


    const result =
      await response.json();


    if (!result.success) {

      if (
        result.message ===
        '沒有管理員權限'
      ) {

        alert(
          '此頁面僅限管理員使用'
        );

        window.location.replace(
          'index.html'
        );

        return;

      }


      sessionStorage.removeItem(
        'fanflowSessionToken'
      );

      sessionStorage.removeItem(
        'fanflowUser'
      );

      window.location.replace(
        'login.html'
      );

      return;

    }


    sessionStorage.setItem(
      'fanflowUser',
      JSON.stringify(
        result.user
      )
    );


  } catch (error) {

    console.error(
      '管理員權限驗證失敗：',
      error
    );

    sessionStorage.removeItem(
      'fanflowSessionToken'
    );

    sessionStorage.removeItem(
      'fanflowUser'
    );

    window.location.replace(
      'login.html'
    );

  }

}

let membersData = [];
let editingMemberId = '';
let currentMemberFilter = 'all';
let currentMemberSearch = '';
    


function openMemberModal() {

  editingMemberId = '';

  document.getElementById(
    'memberModalTitle'

).value = '';

  document.getElementById(

  document.getElementById(

  const defaultDeliveryMethod =

  ) || '🏪 賣貨便';


document.getElementById(
  'memberDeliveryMethod'
).value =
  defaultDeliveryMethod;

  document.getElementById(
    'memberShippingInfo'
  ).value = '';

  document.getElementById(
    'memberNote'
  ).value = '';


  document.getElementById(
    'memberModal'
  ).classList.add('show');

}


    
// =========================
// ♡ 關閉收藏視窗

function closeMemberModal() {

  document
    .getElementById(
      'memberModal'
    )
    .classList
    .remove('show');

}



// =========================
// ♡ 儲存收藏
// =========================

async function saveMember() {

  const name =
    document.getElementById(
      'memberName'
    ).value.trim();


  if (!name) {

    alert(
      '請輸入成員姓名'
    );

    return;

  }


  const saveButton =
    document.getElementById(
      'saveMemberButton'
    );


  saveButton.disabled = true;

  saveButton.textContent =
    '儲存中...';


  // 判斷現在是新增還是編輯
  const isEditing =
    Boolean(editingMemberId);


  try {

    const data = {

      action:
        isEditing
          ? 'updateMember'
          : 'createMember',

      id:
        editingMemberId,

      token:
  fanflowSessionToken,

      name:
        name,


      contact:
        document.getElementById(
          'memberContact'
        ).value.trim(),

      type:
        document.getElementById(
          'memberType'
        ).value,

      deliveryMethod:
        document.getElementById(
          'memberDeliveryMethod'
        ).value,

      shippingInfo:
        document.getElementById(
          'memberShippingInfo'
        ).value.trim(),

      note:
        document.getElementById(
          'memberNote'
        ).value.trim()

    };


    const response =
      await fetch(
        API_URL,
        {
          method:
            'POST',

          body:
            JSON.stringify(
              data
            )
        }
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        (
          isEditing
            ? '修改成員失敗'
            : '新增成員失敗'
        )
      );

    }


    if (isEditing) {

      alert(
        '修改成員成功！👥'
      );

    } else {

      alert(
        '新增成員成功！👥'
      );

    }


    closeMemberModal();


    // 清除編輯狀態
    editingMemberId = '';


    // 清空表單
    document.getElementById(
      'memberName'
    ).value = '';

    document.getElementById(
      'memberContact'
    ).value = '';

    document.getElementById(
      'memberType'
    ).value = '';

    document.getElementById(
      'memberDeliveryMethod'
    ).value = '';

    document.getElementById(
      'memberShippingInfo'
    ).value = '';

    document.getElementById(
      'memberNote'
    ).value = '';


    // 重新讀取成員資料
    await loadMembers();


  } catch (error) {

    console.error(
      error
    );


    alert(
      (
        isEditing
          ? '修改失敗：'
          : '新增失敗：'
      ) +
      error.message
    );


  } finally {

    saveButton.disabled =
      false;

    saveButton.textContent =
      '儲存';

  }

}
    
if (!isEditing) {

  data.login =
    document.getElementById(
      'memberLogin'
    ).value.trim();

  data.password =
    document.getElementById(
      'memberPassword'
    ).value;

  data.role =
    document.getElementById(
      'memberRole'
    ).value;

}

// =========================
// ♡ 顯示收藏卡片
// =========================

function renderMembers(members) {

  const list =
    document.getElementById(
      'memberList'
    );


  if (members.length === 0) {

    list.innerHTML =
      `
        <div class="empty-box">
          🔍 找不到符合條件的成員
        </div>
      `;

    return;

  }


  list.innerHTML =
    members
      .map(
        function(item) {

          return `
            <div class="trade-card">

              <div class="trade-body">

                <div class="trade-name">
                  👤 ${item.name || '未命名成員'}
                </div>

                <div class="trade-detail">
                  ${item.type || '🏷️ 未設定類型'}
                </div>

                <div class="trade-detail">
                  📱 聯絡方式：${item.contact || '未設定'}
                </div>

                <div class="trade-detail">
                  📦 取貨方式：${item.deliveryMethod || '未設定'}
                </div>

                <div class="trade-detail">
                  📮 寄送資訊：${item.shippingInfo || '未設定'}
                </div>

                ${
                  item.note
                    ? `
                      <div class="trade-detail">
                        📝 ${item.note}
                      </div>
                    `
                    : ''
                }

 <div class="trade-actions">

  <button
    type="button"
    class="edit-trade-button"
    onclick="editMember('${item.id}')"
  >
    ✏️ 編輯
  </button>

  <button
    type="button"
    class="delete-trade-button"
    onclick="deleteMemberItem('${item.id}', '${item.name}')"
  >
    🗑️ 刪除
  </button>

</div>
                
              </div>

            </div>
          `;

        }
      )
      .join('');

}

// =========================
// ✏️ 編輯成員
// =========================

function editMember(id) {

  const item =
    membersData.find(
      function(member) {

        return (
          member.id === id
        );

      }
    );


  if (!item) {

    alert(
      '找不到這筆成員資料'
    );

    return;

  }


  editingMemberId =
    item.id;


  document.getElementById(
    'memberModalTitle'
  ).textContent =
    '✏️ 編輯成員';

  document.getElementById(
  'memberLoginFields'
).style.display =
  'none';


  document.getElementById(
    'memberName'
  ).value =
    item.name || '';


  document.getElementById(
    'memberContact'
  ).value =
    item.contact || '';


  document.getElementById(
    'memberType'
  ).value =
    item.type || '';


  document.getElementById(
    'memberDeliveryMethod'
  ).value =
    item.deliveryMethod || '';


  document.getElementById(
    'memberShippingInfo'
  ).value =
    item.shippingInfo || '';


  document.getElementById(
    'memberNote'
  ).value =
    item.note || '';


  document.getElementById(
    'memberModal'
  ).classList.add(
    'show'
  );

}                   

    // =========================
// 🗑️ 刪除成員
// =========================

async function deleteMemberItem(
  id,
  name
) {

  const confirmed =
    confirm(
      `確定要刪除「${name}」嗎？\n\n刪除後會移到 Notion 垃圾桶。`
    );


  if (!confirmed) {

    return;

  }


  try {

    const response =
      await fetch(
        API_URL,
        {
          method:
            'POST',

          body:
            JSON.stringify({
              action:
                'deleteMember',

              id:
                id
            })
        }
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        '刪除成員失敗'
      );

    }


    alert(
      '刪除成員成功！🗑️'
    );


    await loadMembers();


  } catch (error) {

    console.error(
      error
    );


    alert(
      '刪除失敗：' +
      error.message
    );

  }

}
    
// =========================
// 👥 讀取成員名單
// =========================

async function loadMembers() {

  const list =
    document.getElementById(
      'memberList'
    );


  try {

    list.innerHTML =
      `
        <div class="empty-box">
          正在讀取成員資料...
        </div>
      `;


    const response =
      await fetch(
        API_URL +
        '?action=getMembers'
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        '讀取成員資料失敗'
      );

    }


    const members =
      result.data || [];


    membersData =
      members;


    // =========================
    // 👥 更新統計
    // =========================

    document.getElementById(
      'totalMemberCount'
    ).textContent =
      members.length;


    document.getElementById(
      'groupMemberCount'
    ).textContent =
      members.filter(
        function(item) {

          return (
            item.type ===
            '👥 團員'
          );

        }
      ).length;


    document.getElementById(
      'buyerMemberCount'
    ).textContent =
      members.filter(
        function(item) {

          return (
            item.type ===
            '🛒 買家'
          );

        }
      ).length;


    document.getElementById(
      'tradePartnerCount'
    ).textContent =
      members.filter(
        function(item) {

          return (
            item.type ===
            '🔄 交易對象'
          );

        }
      ).length;


    // =========================
    // 沒有資料
    // =========================

    if (
      members.length === 0
    ) {

      list.innerHTML =
        `
          <div class="empty-box">

            👥 目前還沒有成員資料

            <br><br>

            點右上角「＋ 新增成員」開始建立

          </div>
        `;

      return;

    }


    // =========================
    // 顯示成員
    // =========================

    renderMembers(
      members
    );


  } catch (error) {

    console.error(
      error
    );


    list.innerHTML =
      `
        <div class="empty-box">
          ⚠️ 讀取成員資料失敗
          <br><br>
          ${error.message}
        </div>
      `;

  }

}

// =========================
// 🏷️ 收藏類型篩選
// =========================

function setMemberFilter(
  button
) {

  currentMemberFilter =
    button.dataset.type;


  document
    .querySelectorAll(
      '.filter-button'
    )
    .forEach(
      function(item) {

        item.classList.remove(
          'active'
        );

      }
    );


  button.classList.add(
    'active'
  );


  applyMemberFilters();

}


// =========================
// 🔍 搜尋與篩選成員
// =========================

function applyMemberFilters() {

  const searchInput =
    document.getElementById(
      'memberSearch'
    );

  currentMemberSearch =
    searchInput.value
      .trim()
      .toLowerCase();


  const filteredMembers =
    membersData.filter(
      function(item) {

        // 成員類型篩選
        const matchesType =
          currentMemberFilter === 'all' ||
          item.type ===
            currentMemberFilter;


        // 關鍵字搜尋
        const searchText =
          [
            item.name,
            item.contact,
            item.type,
            item.deliveryMethod,
            item.shippingInfo,
            item.note
          ]
            .filter(Boolean)
            .join(' ')
            .toLowerCase();


        const matchesSearch =
          !currentMemberSearch ||
          searchText.includes(
            currentMemberSearch
          );


        return (
          matchesType &&
          matchesSearch
        );

      }
    );


  renderMembers(
    filteredMembers
  );

}


// =========================
// 🔍 搜尋成員
// =========================

document
  .getElementById(
    'memberSearch'
  )
  .addEventListener(
    'input',
    applyMemberFilters
  );


// =========================
// 👥 開啟頁面時自動讀取
// =========================

loadMembers();
</script>
