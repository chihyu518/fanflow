<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FanFlow｜小卡交易</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      background: #f6f7fb;
      color: #222;
    }

    /* =========================
       左側選單
    ========================= */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 230px;
      background: white;
      border-right: 1px solid #eeeeee;
      padding: 24px 16px;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 30px;
      padding-left: 12px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      margin-bottom: 6px;
      border-radius: 12px;
      color: #555;
      text-decoration: none;
      font-size: 15px;
    }

    .menu-item:hover {
      background: #f5f6fa;
    }

    .menu-item.active {
      background: #eef1ff;
      color: #4056d6;
      font-weight: 700;
    }


    /* =========================
       主畫面
    ========================= */

    .main {
      margin-left: 230px;
      padding: 35px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .page-title {
      margin: 0;
      font-size: 28px;
    }

    .page-subtitle {
      margin-top: 7px;
      color: #888;
      font-size: 14px;
    }

    .add-button {
      border: none;
      background: #4056d6;
      color: white;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }


    /* =========================
       統計卡
    ========================= */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #eeeeee;
    }

    .stat-label {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 25px;
      font-weight: 800;
    }


    /* =========================
       搜尋／篩選
    ========================= */

    .toolbar {
      background: white;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-button {
      border: 1px solid #dddddd;
      background: white;
      padding: 8px 13px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    .filter-button.active {
      background: #4056d6;
      border-color: #4056d6;
      color: white;
    }


    /* =========================
       小卡區
    ========================= */

    .card-grid {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 18px;
    }

    .trade-card {
      background: white;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      overflow: hidden;
    }

    .trade-image {
      width: 100%;
      height: 230px;
      object-fit: cover;
      background: #f1f2f6;
    }

    .trade-placeholder {
      height: 230px;
      background: #f1f2f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .trade-body {
      padding: 16px;
    }

    .trade-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .trade-detail {
      color: #666;
      font-size: 14px;
      margin-top: 6px;
    }

    .empty-box {
      grid-column: 1 / -1;
      background: white;
      border: 1px dashed #d8d8d8;
      border-radius: 16px;
      padding: 60px 20px;
      text-align: center;
      color: #888;
    }


    /* =========================
       手機版
    ========================= */

    @media (max-width: 800px) {

      .sidebar {
        width: 75px;
        padding:
          24px 10px;
      }

      .logo {
        font-size: 0;
        padding-left: 10px;
      }

      .logo::after {
        content: "F";
        font-size: 24px;
      }

      .menu-text {
        display: none;
      }

      .menu-item {
        justify-content: center;
        font-size: 20px;
      }

      .main {
        margin-left: 75px;
        padding: 20px;
      }

      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .card-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>

  <!-- 左側選單 -->

  <aside class="sidebar">

    <div class="logo">
      FanFlow
    </div>

    <a
      href="index.html"
      class="menu-item"
    >
      🏠
      <span class="menu-text">
        首頁
      </span>
    </a>

    <a
      href="groupbuy.html"
      class="menu-item"
    >
      🛍️
      <span class="menu-text">
        周邊代購
      </span>
    </a>

    <a
      href="cardtrade.html"
      class="menu-item active"
    >
      🃏
      <span class="menu-text">
        小卡交易
      </span>
    </a>

    <a
      href="#"
      class="menu-item"
    >
      💰
      <span class="menu-text">
        帳務中心
      </span>
    </a>

    <a
      href="#"
      class="menu-item"
    >
      ♡
      <span class="menu-text">
        收藏庫
      </span>
    </a>

    <a
      href="#"
      class="menu-item"
    >
      👥
      <span class="menu-text">
        成員管理
      </span>
    </a>

    <a
      href="#"
      class="menu-item"
    >
      🔔
      <span class="menu-text">
        通知中心
      </span>
    </a>

    <a
      href="#"
      class="menu-item"
    >
      ⚙️
      <span class="menu-text">
        設定
      </span>
    </a>

  </aside>


  <!-- 主畫面 -->

  <main class="main">

    <div class="page-header">

      <div>

        <h1 class="page-title">
          🃏 小卡交易
        </h1>

        <div class="page-subtitle">
          管理出售、收購與交換的小卡
        </div>

      </div>

      <button class="add-button">
        ＋ 新增小卡
      </button>

    </div>


    <!-- 統計 -->

    <div class="stats">

      <div class="stat-card">

        <div class="stat-label">
          🃏 小卡總數
        </div>

        <div
  class="stat-number"
  id="totalCardCount"
>
  0
</div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          🔵 出售
        </div>

        <div
  class="stat-number"
  id="sellCardCount"
>
  0
</div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          🟣 收購
        </div>

        <div
  class="stat-number"
  id="buyCardCount"
>
  0
</div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          🟢 交換
        </div>

       <div
  class="stat-number"
  id="tradeCardCount"
>
  0
</div>

      </div>

    </div>


    <!-- 搜尋與篩選 -->

    <div class="toolbar">

      <input
        class="search-input"
        type="text"
        placeholder="🔍 搜尋小卡、團體、成員..."
      >

      <div class="filter-row">

        <button
          class="filter-button active"
        >
          全部
        </button>

        <button class="filter-button">
          🔵 出售
        </button>

        <button class="filter-button">
          🟣 收購
        </button>

        <button class="filter-button">
          🟢 交換
        </button>

      </div>

    </div>


    <!-- 小卡列表 -->

    <div
  class="card-grid"
  id="cardTradeList"
>

      <div class="empty-box">

        🃏 目前還沒有小卡交易資料
        <br><br>
        點右上角「＋ 新增小卡」開始建立

      </div>

    </div>

  </main>

</body>

</html>
