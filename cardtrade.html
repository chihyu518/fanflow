    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:

        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      background: #f6f7fb;
      color: #222;
    }

    /* =========================
       左側選單
    ========================= */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 230px;
      background: white;
      border-right: 1px solid #eeeeee;
      padding: 24px 16px;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 30px;
      padding-left: 12px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      margin-bottom: 6px;
      border-radius: 12px;
      color: #555;
      text-decoration: none;
      font-size: 15px;
    }

    .menu-item:hover {
      background: #f5f6fa;
    }

    .menu-item.active {
      background: #eef1ff;
      color: #4056d6;
      font-weight: 700;
    }


    /* =========================
       主畫面
    ========================= */

    .main {
      margin-left: 230px;
      padding: 35px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .page-title {
      margin: 0;
      font-size: 28px;
    }

    .page-subtitle {
      margin-top: 7px;
      color: #888;
      font-size: 14px;
    }

    .add-button {
      border: none;
      background: #4056d6;
      color: white;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }


    /* =========================
       統計卡
    ========================= */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #eeeeee;
    }

    .stat-label {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 25px;
      font-weight: 800;
    }


    /* =========================
       搜尋／篩選
    ========================= */

    .toolbar {
      background: white;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-button {
      border: 1px solid #dddddd;
      background: white;
      padding: 8px 13px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    .filter-button.active {
      background: #4056d6;
      border-color: #4056d6;
      color: white;
    }


    /* =========================
       小卡區
    ========================= */

    .card-grid {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 18px;
    }

    .trade-card {
      background: white;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      overflow: hidden;
    }

    .trade-image {
      width: 100%;
      height: 230px;
      object-fit: cover;
      background: #f1f2f6;
    }

    .trade-placeholder {
      height: 230px;
      background: #f1f2f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;

      margin-bottom: 8px;
    }

      margin-top: 6px;

      border-radius: 16px;

       手機版
    ========================= */

    function compressImage(file) {

      return new Promise(
        (
          resolve,
          reject
        ) => {

          const reader =
            new FileReader();


          reader.onload =
            function(event) {

              const img =
                new Image();


              img.onload =
                function() {

                  const maxWidth =
                    1200;

                  const maxHeight =
                    1200;


                  let width =
                    img.width;

                  let height =
                    img.height;


                  if (
                    width > maxWidth ||
                    height > maxHeight
                  ) {

                    const ratio =
                      Math.min(
                        maxWidth / width,
                        maxHeight / height
                      );


                    width =
                      Math.round(
                        width * ratio
                      );


                    height =
                      Math.round(
                        height * ratio
                      );

                  }


                  const canvas =
                    document.createElement(
                      'canvas'
                    );


                  canvas.width =
                    width;

                  canvas.height =
                    height;


                  const ctx =
                    canvas.getContext(
                      '2d'
                    );


                  ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                  );


                  const compressedData =
                    canvas.toDataURL(
                      'image/jpeg',
                      0.8
                    );


                  resolve(
                    compressedData
                  );

                };


              img.onerror =
                function() {

                  reject(
                    new Error(
                      '圖片處理失敗'
                    )
                  );

                };


              img.src =
                event.target.result;

            };


          reader.onerror =
            function() {

              reject(
                new Error(
                  '圖片讀取失敗'
                )
              );

            };


          reader.readAsDataURL(
            file
          );

        }
      );

    }

function editCardTrade(id) {

  const item =
    cardTradesData.find(
      function(trade) {
        return trade.id === id;
      }
    );


  if (!item) {
    alert('找不到這筆小卡資料');
    return;
  }


  editingCardTradeId =
    item.id;

  

  document.getElementById(
    'cardTradeModalTitle'
  ).textContent =
    '✏️ 編輯小卡';


  document.getElementById(
    'cardName'
  ).value =
    item.name || '';


  document.getElementById(
    'cardTradeType'
  ).value =
    item.tradeType ||
    '🔵 出售';


  document.getElementById(
    'cardGroup'

  document.getElementById(

async function toggleCardPaymentStatus(id) {

  const item =
    cardTradesData.find(
      function(trade) {
        return trade.id === id;
      }
    );

  if (!item) {
    alert('找不到這筆小卡資料');
    return;
  }


  const newPaymentStatus =
    item.paymentStatus ===
    '🟢 已付款'
      ? '🔴 未付款'
      : '🟢 已付款';


  try {

    const data = {

      action:
        'updateCardTrade',

      id:
        item.id,

      name:
        item.name || '',

      tradeType:
        item.tradeType ||
        '🔵 出售',

      group:
        item.group || '',

      member:
        item.member || '',

      version:
        item.version || '',

      imageUrl:
        item.imageUrl || '',

      price:
        item.price || 0,

      quantity:
        item.quantity || 1,

      partner:
        item.partner || '',

      tradeStatus:
        item.tradeStatus ||
        '🟡 交易中',

      paymentStatus:
        newPaymentStatus,

      shippingStatus:
        item.shippingStatus ||
        '⚪ 未寄出',

      note:
        item.note || ''

    };


    const response =
      await fetch(
        API_URL,
        {

    alert('請輸入小卡名稱');
    return;
  }


  const saveButton =
    document.getElementById(
      'saveCardTradeButton'

  try {

    imageInput.files[0];

  let imageData = '';
  let imageName = '';
  let imageType = '';

    let existingImageUrl = '';

if (editingCardTradeId) {

    cardTradesData.find(
      function(item) {
        return (

      }

      editingItem.imageUrl || '';

  const data = {

      ? 'updateCardTrade'

    id:
  editingCardTradeId,

imageUrl:
  existingImageUrl,

  name:
    name,

          'cardTradeType'
        ).value,

      group:
        document.getElementById(
          'cardGroup'
        ).value.trim(),

      member:
        document.getElementById(
          'cardMember'
        ).value.trim(),

      version:
        document.getElementById(
          'cardVersion'
        ).value.trim(),

      price:
        Number(
          document.getElementById(
            'cardPrice'
          ).value
        ) || 0,

      quantity:
        Number(
          document.getElementById(
            'cardQuantity'
          ).value
        ) || 1,

      partner:
        document.getElementById(
          'cardPartner'
        ).value.trim(),

      tradeStatus:
        '🟡 交易中',

      paymentStatus:
        '🔴 未付款',

      shippingStatus:
        '⚪ 未寄出',

      note:
  document.getElementById(
    'cardNote'
  ).value.trim(),

imageData:
  imageData,

imageName:
  imageName,

imageType:
  imageType

};


    const response =
      await fetch(
        API_URL,
        {
          method: 'POST',

          body:
            JSON.stringify(data)

    const result =
      await response.json();

      throw new Error(

    if (editingCardTradeId) {

  alert('修改小卡成功！✏️');

} else {

}

      'cardName'

      'cardTradeType'

function renderCardTrades(trades) {

  const list =
    document.getElementById(
      'cardTradeList'
    );

  if (trades.length === 0) {

    list.innerHTML =
      `
        <div class="empty-box">
          🔍 找不到符合條件的小卡
        </div>
      `;

    return;
  }


  list.innerHTML =
    trades
      .map(
        function(item) {

          const imageHtml =
            item.imageUrl
              ? `
                <img
                  class="trade-image"
                  src="${item.imageUrl}"
                  alt=""
                >
              `
              : `
                <div
                  class="trade-placeholder"
                >
                  🃏
                </div>
              `;


          return `
            <div class="trade-card">

              ${imageHtml}

              <div class="trade-body">

                <div class="trade-name">
                  ${item.name || '未命名小卡'}
                </div>

                <div class="trade-detail">
                  ${item.tradeType || ''}
                </div>

                <div class="trade-detail">
                  🎤 ${item.group || '未設定'}
                </div>

                <div class="trade-detail">
                  👤 ${item.member || '未設定'}
                </div>

                <div class="trade-detail">
                  🏷️ ${item.version || '未設定'}
                </div>

                <div class="trade-detail">
                  💰 NT$ ${
                    Number(
                      item.price
                    ).toLocaleString()
                  }
                </div>

                <div class="trade-detail">
                  🔢 數量：${item.quantity || 0}
                </div>

                <div
  class="trade-detail status-clickable"
  onclick="toggleCardTradeStatus('${item.id}')"
  title="點一下切換交易狀態"
>
  ${item.tradeStatus || '🟡 交易中'}
</div>

                <div
  class="trade-detail status-clickable"
  onclick="toggleCardPaymentStatus('${item.id}')"
  title="點一下切換付款狀態"
>
  ${item.paymentStatus || '🔴 未付款'}
</div>

                <div
  class="trade-detail status-clickable"
  onclick="toggleCardShippingStatus('${item.id}')"
  title="點一下切換寄送狀態"
>
  ${item.shippingStatus || '⚪ 未寄出'}
</div>

                <div class="trade-actions">

                  <button
                    type="button"
                    class="edit-trade-button"
                    onclick="editCardTrade('${item.id}')"
                  >
                    ✏️ 編輯
                  </button>

                  <button
                    type="button"
                    class="delete-trade-button"
                    onclick="deleteCardTrade('${item.id}', '${item.name || '未命名小卡'}')"
                  >
                    🗑️ 刪除
                  </button>

                </div>

              </div>

            </div>
          `;

        }
      )
      .join('');

}
    
  async function loadCardTrades() {

    const list =
      document.getElementById(
        'cardTradeList'
      );

    try {

      list.innerHTML =
        `
          <div class="empty-box">
            正在讀取小卡交易...
          </div>
        `;


      const response =
        await fetch(
          API_URL +
          '?action=getCardTrades'
        );


      const result =
        await response.json();


      if (!result.success) {

        throw new Error(
          result.message ||
          '讀取小卡交易失敗'
        );

      }


      const trades =
        result.data || [];

      cardTradesData = trades;

      // =========================
      // 更新統計
      // =========================

      document.getElementById(
        'totalCardCount'
      ).textContent =
        trades.length;


      document.getElementById(
        'sellCardCount'
      ).textContent =
        trades.filter(
          function(item) {
            return (
              item.tradeType ===
              '🔵 出售'
            );
          }
        ).length;


      document.getElementById(
        'buyCardCount'
      ).textContent =
        trades.filter(
          function(item) {
            return (
              item.tradeType ===
              '🟣 收購'
            );
          }
        ).length;


      document.getElementById(
        'tradeCardCount'
      ).textContent =
        trades.filter(
          function(item) {
            return (
              item.tradeType ===
              '🟢 交換'
            );
          }
        ).length;


      // =========================
      // 沒有資料
      // =========================

      if (trades.length === 0) {

        list.innerHTML =
          `
            <div class="empty-box">

              🃏 目前還沒有小卡交易資料

              <br><br>

              點右上角「＋ 新增小卡」開始建立

            </div>
          `;

        return;

      }


      // =========================
      // 顯示小卡
      // =========================

renderCardTrades(trades);
      
    } catch (error) {

      console.error(error);

      list.innerHTML =
        `
          <div class="empty-box">
            ⚠️ 讀取小卡交易失敗
            <br><br>
            ${error.message}
          </div>
        `;

    }

  }

// 🔍 搜尋＋類型篩選
// =========================

function applyCardTradeFilters() {

  const searchInput =
    document.getElementById(
      'cardTradeSearch'
    );

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();


  const filteredTrades =
    cardTradesData.filter(
      function(item) {

        // 交易類型
        const typeMatched =
          currentCardTradeFilter === 'all' ||
          item.tradeType ===
            currentCardTradeFilter;


        // 搜尋文字
        const searchText = [
          item.name,
          item.group,
          item.member,
          item.version,
          item.partner
        ]
          .join(' ')
          .toLowerCase();


        const keywordMatched =
          !keyword ||
          searchText.includes(
            keyword
          );


        return (
          typeMatched &&
          keywordMatched
        );

      }
    );


  renderCardTrades(
    filteredTrades
  );

}

    function setCardTradeFilter(
  button
) {

  currentCardTradeFilter =
    button.dataset.type;


  document
    .querySelectorAll(
      '.filter-button'
    )
    .forEach(
      function(item) {
        item.classList.remove(
          'active'
        );
      }
    );


  button.classList.add(
    'active'
  );


  applyCardTradeFilters();

}
    
    // =========================
// 🔍 搜尋小卡
// =========================

document
  .getElementById(
    'cardTradeSearch'
  )
  .addEventListener(
    'input',
    applyCardTradeFilters
  );
    

  // 開啟頁面時自動讀取
  loadCardTrades();

</script>
