<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FanFlow｜小卡交易</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      background: #f6f7fb;
      color: #222;
    }

    /* =========================
       左側選單
    ========================= */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 230px;
      background: white;
      border-right: 1px solid #eeeeee;
      padding: 24px 16px;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 30px;
      padding-left: 12px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      margin-bottom: 6px;
      border-radius: 12px;
      color: #555;
      text-decoration: none;
      font-size: 15px;
    }

    .menu-item:hover {
      background: #f5f6fa;
    }

    .menu-item.active {
      background: #eef1ff;
      color: #4056d6;
      font-weight: 700;
    }


    /* =========================
       主畫面
    ========================= */

    .main {
      margin-left: 230px;
      padding: 35px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .page-title {
      margin: 0;
      font-size: 28px;
    }

    .page-subtitle {
      margin-top: 7px;
      color: #888;
      font-size: 14px;
    }

    .add-button {
      border: none;
      background: #4056d6;
      color: white;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }


    /* =========================
       統計卡
    ========================= */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #eeeeee;
    }

    .stat-label {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 25px;
      font-weight: 800;
    }


    /* =========================
       搜尋／篩選
    ========================= */

    .toolbar {
      background: white;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-button {
      border: 1px solid #dddddd;
      background: white;
      padding: 8px 13px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    .filter-button.active {
      background: #4056d6;
      border-color: #4056d6;
      color: white;
    }


    /* =========================
       小卡區
    ========================= */

    .card-grid {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 18px;
    }

    .trade-card {
      background: white;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      overflow: hidden;
    }

    .trade-image {
      width: 100%;
      height: 230px;
      object-fit: cover;
      background: #f1f2f6;
    }

    .trade-placeholder {
      height: 230px;
      background: #f1f2f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .trade-body {
      padding: 16px;
    }

    .trade-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .trade-detail {
      color: #666;
      font-size: 14px;
      margin-top: 6px;
    }

    .empty-box {
      grid-column: 1 / -1;
      background: white;
      border: 1px dashed #d8d8d8;
      border-radius: 16px;
      padding: 60px 20px;
      text-align: center;
      color: #888;
    }


    /* =========================
       手機版
    ========================= */

    @media (max-width: 800px) {

      .sidebar {
        width: 75px;
        padding:
          24px 10px;
      }

      .logo {
        font-size: 0;
        padding-left: 10px;
      }

      .logo::after {
        content: "F";
        font-size: 24px;
      }

      .menu-text {
        display: none;
      }

      .menu-item {
        justify-content: center;
        font-size: 20px;
      }

      .main {
        margin-left: 75px;
        padding: 20px;
      }

      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .card-grid {
        grid-template-columns: 1fr;
      }

    }

    /* =========================

========================= */

.form-group {

.form-group label {

  font-size: 14px;
  font-weight: 700;
  color: #444;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  border: 1px solid #dddddd;
  border-radius: 10px;
  padding: 11px 12px;
  font-size: 15px;

.form-group input:focus,

}

.form-row {

.modal-actions {

}

.cancel-button,

  border-radius: 10px;

  font-size: 15px;
  font-weight: 700;

.cancel-button {

@media (max-width: 600px) {

  padding: 4px 6px;
  margin-left: -6px;

  <script>

  const API_URL =
    'https://script.google.com/macros/s/AKfycbz7CVrbddXxIvd86Z3PeMyM9MT6q7QBe7EJ5n1uQU7pTkwCYgc-4gjcg7EmRmz5itDSJQ/exec';

    // =========================
// 🔐 FanFlow 登入保護
// =========================

// =========================
// 🔐 FanFlow Session 驗證
// 第一次失敗會自動重試一次
// =========================

const fanflowSessionToken =
  sessionStorage.getItem(
    'fanflowSessionToken'
  ) ||
  localStorage.getItem(
    'fanflowSessionToken'
  );


if (!fanflowSessionToken) {

  window.location.replace(
    'login.html'
  );

} else {

  // 如果 sessionStorage 沒有，
  // 從 localStorage 找到，就補回 sessionStorage
  sessionStorage.setItem(
    'fanflowSessionToken',
    fanflowSessionToken
  );

  verifyFanFlowSession();

}


async function verifyFanFlowSession() {

  const maxAttempts = 2;


  for (
    let attempt = 1;
    attempt <= maxAttempts;
    attempt++
  ) {

    try {

      console.log(
        '📱 Session 驗證，第 ' +
        attempt +
        ' 次'
      );


      const response =
        await fetch(
          API_URL,
          {
            method: 'POST',

            body:
              JSON.stringify({
                action:
                  'verifyFanFlowSession',

                token:
                  fanflowSessionToken
              })
          }
        );


      const result =
        await response.json();


      console.log(
        '📱 Session 驗證結果：',
        result
      );


      // =========================
      // ❌ Session 確定無效
      // =========================

      if (!result.success) {

        alert(
          '❌ Session 驗證失敗\n\n' +
          '原因：' +
          (
            result.message ||
            '沒有收到錯誤訊息'
          )
        );

        return;

      }


      // =========================
      // ✅ Session 驗證成功
      // =========================

      localStorage.setItem(
        'fanflowUser',
        JSON.stringify(
          result.user
        )
      );


      sessionStorage.setItem(
        'fanflowUser',
        JSON.stringify(
          result.user
        )
      );


      console.log(
        '目前登入者資料：',
        result.user
      );


      // 載入小卡交易成員
      loadCardMembers();


      // 成功就直接結束
      return;


    } catch (error) {

      console.error(
        '📱 Session 驗證失敗，第 ' +
        attempt +
        ' 次：',
        error
      );


      // =========================
      // 📱 第一次失敗
      // 等一下再試一次
      // =========================

      if (attempt < maxAttempts) {

        console.log(
          '📱 Session 驗證失敗，' +
          '1 秒後重新嘗試...'
        );


        await new Promise(
          function(resolve) {

            setTimeout(
              resolve,
              1000
            );

          }
        );


        continue;

      }


      // =========================
      // ❌ 兩次都失敗
      // 不刪除 Token
      // 不踢回登入頁
      // =========================

      alert(
        '⚠️ Session 驗證暫時失敗\n\n' +
        '目前沒有登出，請重新整理頁面再試一次。'
      );

    }

  }

}


/* =========================
   👤 讀取成員名單
========================= */

async function loadCardMembers() {

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: 'POST',

          body:
            JSON.stringify({
              action:
                'getMembers',

              token:
                fanflowSessionToken
            })
        }
      );


    const result =
      await response.json();


    if (!result.success) {

      console.error(
        '讀取成員名單失敗：',
        result.message || ''
      );

      return;

    }


    const memberSelect =
  document.getElementById(
    'cardMember'
  );

const partnerSelect =
  document.getElementById(
    'cardPartner'
  );


if (!memberSelect) {

  console.error(
    '找不到 cardMember'
  );

  return;

}


if (!partnerSelect) {

  console.error(
    '找不到 cardPartner'
  );

  return;

}


memberSelect.innerHTML =
  '<option value="">請選擇成員</option>';

partnerSelect.innerHTML =
  '<option value="">請選擇交易對象</option>';


const members =
  result.data || [];

    console.log('成員資料：', result.data);

const currentUser =
  JSON.parse(
    sessionStorage.getItem(
      'fanflowUser'
    ) || '{}'
  );


members.forEach(
  function(member) {

    if (!member.name) {
      return;
    }


    // 👤 成員
    const option =
      document.createElement(
        'option'
      );

    option.value =
      member.name;

    option.textContent =
      member.name;

    memberSelect.appendChild(
      option
    );


    // 👥 交易對象
    const partnerOption =
      document.createElement(
        'option'
      );

    partnerOption.value =
      member.name;

    partnerOption.textContent =
      member.name;

    partnerSelect.appendChild(
      partnerOption
    );

  }
);

    // =========================
// 👤 自動帶入目前登入者
// =========================

const fanflowUser =
  JSON.parse(
    sessionStorage.getItem(
      'fanflowUser'
    ) || 'null'
  );

if (fanflowUser && fanflowUser.name) {

  if (fanflowUser.role === '👑 管理員') {

    // 管理員：可以自由選擇成員
    memberSelect.disabled = false;

  } else {

    // 一般成員：自動帶入自己
    memberSelect.value =
      fanflowUser.name;

    memberSelect.disabled = true;

  }

}

    function compressImage(file) {

      return new Promise(
        (
          resolve,
          reject
        ) => {

          const reader =
            new FileReader();


          reader.onload =
            function(event) {

              const img =
                new Image();


              img.onload =
                function() {

                  const maxWidth =
                    1200;

                  const maxHeight =
                    1200;


                  let width =
                    img.width;

                  let height =
                    img.height;


                  if (
                    width > maxWidth ||
                    height > maxHeight
                  ) {

                    const ratio =
                      Math.min(
                        maxWidth / width,
                        maxHeight / height
                      );


                    width =
                      Math.round(
                        width * ratio
                      );


                    height =
                      Math.round(
                        height * ratio
                      );

                  }


                  const canvas =
                    document.createElement(
                      'canvas'
                    );


                  canvas.width =
                    width;

                  canvas.height =
                    height;


                  const ctx =
                    canvas.getContext(
                      '2d'
                    );


                  ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                  );


                  const compressedData =
                    canvas.toDataURL(
                      'image/jpeg',
                      0.8
                    );


                  resolve(
                    compressedData
                  );

                };


              img.onerror =
                function() {

                  reject(
                    new Error(
                      '圖片處理失敗'
                    )
                  );

                };


              img.src =
                event.target.result;

            };


          reader.onerror =
            function() {

              reject(
                new Error(
                  '圖片讀取失敗'
                )
              );

            };


          reader.readAsDataURL(
            file
          );

        }
      );

    }

    if (imageFile) {

      imageName =
        'cardtrade-' + Date.now() + '.jpg';

      imageType = 'image/jpeg';

    }

    // 🖼️ 編輯時保留原本圖片
    const existingImageUrl = isEditing
      ? (original.imageUrl || '')

    const data = {

      action: isEditing

      id: isEditing
        ? editingCardTradeId

      name: name,

      tradeType:

        document.getElementById('cardGroup').value.trim(),

      imageData: imageData,
      imageName: imageName,
      imageType: imageType

    };

    if (isEditing) {

      // 🔐 使用建立者讀取的完整原始狀態
      data.tradeStatus = original.tradeStatus;
      data.paymentStatus = original.paymentStatus;
      data.shippingStatus = original.shippingStatus;

    } else {

      // 🆕 新交易才設定預設狀態

      data.paymentStatus = '🔴 未付款';
      data.shippingStatus = '⚪ 未寄出';

    }

    const response = await fetch(API_URL, {

      method: 'POST',

      body: JSON.stringify(data)

    const result = await response.json();

    if (!result.success) {
      throw new Error(
        result.message || '儲存小卡失敗'

    alert(

    // 🧹 清除編輯資料
    editingCardTradeId = '';
    window.editingCardTradeData = null;

function renderCardTrades(trades) {

  const list =
    document.getElementById('cardTradeList');

  if (!list) return;

  // 🔐 使用目前登入者資料
  let currentUser = null;

  try {
    currentUser = JSON.parse(
      sessionStorage.getItem('fanflowUser') || 'null'
    );
  } catch (error) {
    currentUser = null;
  }

  // 🛡️ 避免輸入內容被當成 HTML 執行
  const escapeHtml = function(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  };

  if (!trades.length) {
    list.innerHTML =
      '<div class="empty-box">🔍 找不到符合條件的小卡</div>';
    return;
  }

  list.innerHTML = trades.map(function(item) {

    // 🔐 不區分管理員或一般成員
    const isOwner = Boolean(
      currentUser &&
      currentUser.id &&
      item.creatorId &&
      String(currentUser.id) ===
        String(item.creatorId)
    );

    const id = escapeHtml(item.id);

    const imageHtml = item.imageUrl
      ? `
        <img
          class="trade-image"
          src="${escapeHtml(item.imageUrl)}"
          alt=""
        >
      `
      : `
        <div class="trade-placeholder">🃏</div>
      `;

    const actionsHtml = isOwner
      ? `
        <div class="trade-actions">

          <button
            type="button"
            class="edit-trade-button"
            data-trade-id="${id}"
          >
            ✏️ 編輯
          </button>

          <button
            type="button"
            class="delete-trade-button"
            data-trade-id="${id}"
          >
            🗑️ 刪除
          </button>

        </div>
      `
      : '';

    return `
      <div class="trade-card">

        ${imageHtml}

        <div class="trade-body">

          <div class="trade-name">
            ${escapeHtml(item.name || '未命名小卡')}
          </div>

          <div class="trade-detail">
            ${escapeHtml(item.tradeType || '')}
          </div>

          <div class="trade-detail">
            🎤 ${escapeHtml(item.group || '未設定')}
          </div>

          <div class="trade-detail">
            👤 ${escapeHtml(item.member || '未設定')}
          </div>

          <div class="trade-detail">
            🏷️ ${escapeHtml(item.version || '未設定')}
          </div>

          <div class="trade-detail">
            💰 NT$ ${Number(item.price || 0).toLocaleString()}
          </div>

          <div class="trade-detail">
            🔢 數量：${Number(item.quantity || 0)}
          </div>

          <div class="trade-detail">
            ${escapeHtml(item.tradeStatus || '狀態未設定')}
          </div>

          ${actionsHtml}

        </div>

      </div>
    `;

  }).join('');

  // ✏️ 只有建立者會有編輯按鈕
  list.querySelectorAll('.edit-trade-button')
    .forEach(function(button) {

      button.addEventListener('click', function() {
        editCardTrade(button.dataset.tradeId);
      });

    });

  // 🗑️ 只有建立者會有刪除按鈕
  list.querySelectorAll('.delete-trade-button')
    .forEach(function(button) {

      button.addEventListener('click', function() {

        const trade = trades.find(function(item) {
          return String(item.id) ===
            String(button.dataset.tradeId);
        });

        deleteCardTrade(
          button.dataset.tradeId,
          trade?.name || '未命名小卡'
        );

      });

    });

}

          item.group,
          item.member,
          item.version,
          item.partner
        ]
          .join(' ')
          .toLowerCase();


        const keywordMatched =
          !keyword ||
          searchText.includes(
            keyword
          );


        return (
          typeMatched &&
          keywordMatched
        );

      }
    );


  renderCardTrades(
    filteredTrades
  );

}

    function setCardTradeFilter(
  button
) {

  currentCardTradeFilter =
    button.dataset.type;


  document
    .querySelectorAll(
      '.filter-button'
    )
    .forEach(
      function(item) {
        item.classList.remove(
          'active'
        );
      }
    );


  button.classList.add(
    'active'
  );


  applyCardTradeFilters();

}
    
    // =========================
// 🔍 搜尋小卡
// =========================

document
  .getElementById(
    'cardTradeSearch'
  )
  .addEventListener(
    'input',
    applyCardTradeFilters
  );
    

  // 開啟頁面時自動讀取
  loadCardTrades();

</script>
  
</body>
